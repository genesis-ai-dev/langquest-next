name: Docker images
description: >
  Keep the container images a job pulls (the Supabase CLI's, from ECR Public;
  with job-images, the job container's base image from Docker Hub) between
  runs, so a registry's per-IP limit on anonymous pulls does not fail a job.
  Use it twice: phase restore before the job starts its stack, phase save as
  the job's last step (it saves only when the restore was not an exact hit).
  Needs npm ci first. scripts/ci-docker-images.sh does the work. With load
  'false', restore only fetches the archive, and the job runs
  `ci-docker-images.sh load` (and `warm`, for job images) itself, in the
  background before it starts the stack (decisions.md 163). Phase warm
  (guardrails warm-caches, on main) fills both caches, the stack's and the
  job images', when either is missing, and only looks them up otherwise
  (decisions.md 164).

inputs:
  phase:
    description: restore, save or warm
    required: true
  job-images:
    description: "'true' for a job that runs wrangler dev with the job container (ui-web, nightly)"
    default: 'false'
  load:
    description: "'false' to leave loading the images (and pulling the job container's) to the job"
    default: 'true'
  dockerhub-username:
    description: Optional. With dockerhub-token, signs in to Docker Hub for a higher pull limit.
    default: ''
  dockerhub-token:
    description: Optional. A Docker Hub access token with read-only access to public repositories.
    default: ''

runs:
  using: composite
  steps:
    - name: Work out the cache key
      id: key
      shell: bash
      env:
        JOBS: ${{ inputs.job-images == 'true' && 'jobs' || '' }}
      run: |
        echo "key=$(bash scripts/ci-docker-images.sh key $JOBS)" >> "$GITHUB_OUTPUT"
        echo "prefix=$(bash scripts/ci-docker-images.sh prefix)" >> "$GITHUB_OUTPUT"

    # --- restore: before the stack starts ---------------------------------
    - name: Restore the cached images
      if: inputs.phase == 'restore'
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/docker-images.tar.zst
        key: ${{ steps.key.outputs.key }}
        # An older cache (a Supabase CLI or config change since) still has most images.
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Load them into Docker
      if: inputs.phase == 'restore'
      shell: bash
      env:
        LOAD: ${{ inputs.load }}
      run: |
        echo "${{ steps.restore.outputs.cache-hit }}" > "$RUNNER_TEMP/docker-images.hit"
        if [ "$LOAD" = true ]; then bash scripts/ci-docker-images.sh load; else echo "the job loads them"; fi
    - name: Pull the job container's images (retrying)
      if: inputs.phase == 'restore' && inputs.job-images == 'true' && inputs.load == 'true'
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
      run: bash scripts/ci-docker-images.sh warm

    # --- save: after the job's tests, so it never delays them --------------
    - name: Was the cache complete?
      if: inputs.phase == 'save'
      id: needed
      shell: bash
      run: |
        if [ "$(cat "$RUNNER_TEMP/docker-images.hit" 2> /dev/null)" = true ]; then echo "save=false" >> "$GITHUB_OUTPUT"; else echo "save=true" >> "$GITHUB_OUTPUT"; fi
    - name: Pack the images this job pulled
      if: inputs.phase == 'save' && steps.needed.outputs.save == 'true'
      id: pack
      shell: bash
      env:
        JOBS: ${{ inputs.job-images == 'true' && 'jobs' || '' }}
      run: |
        rm -f "$RUNNER_TEMP/docker-images.tar.zst"
        bash scripts/ci-docker-images.sh save $JOBS
        if [ -s "$RUNNER_TEMP/docker-images.tar.zst" ]; then echo "packed=true" >> "$GITHUB_OUTPUT"; fi
    - name: Save them for the next run
      if: inputs.phase == 'save' && steps.pack.outputs.packed == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/docker-images.tar.zst
        key: ${{ steps.key.outputs.key }}

    # --- warm: on main, for the pull requests after it ---------------------
    - name: Both caches' keys
      if: inputs.phase == 'warm'
      id: warm-keys
      shell: bash
      run: |
        echo "stack=$(bash scripts/ci-docker-images.sh key)" >> "$GITHUB_OUTPUT"
        echo "jobs=$(bash scripts/ci-docker-images.sh key jobs)" >> "$GITHUB_OUTPUT"
    - name: Is the stack's cache there?
      if: inputs.phase == 'warm'
      id: warm-stack
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/docker-images.tar.zst
        key: ${{ steps.warm-keys.outputs.stack }}
        lookup-only: true
    - name: Is the job images' cache there?
      if: inputs.phase == 'warm'
      id: warm-jobs
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/docker-images.tar.zst
        key: ${{ steps.warm-keys.outputs.jobs }}
        lookup-only: true
    - name: Restore an older cache, for the images it still has
      if: inputs.phase == 'warm' && (steps.warm-stack.outputs.cache-hit != 'true' || steps.warm-jobs.outputs.cache-hit != 'true')
      id: warm-older
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/docker-images.tar.zst
        key: ${{ steps.warm-keys.outputs.jobs }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Pull the rest (the stack as ui-web starts it, and the job container's)
      if: steps.warm-older.conclusion == 'success'
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
      run: |
        bash scripts/ci-docker-images.sh load
        bash scripts/ci-docker-images.sh warm
        bash scripts/ci-retry-pull.sh npm run db:start
    - name: Pack the stack's images
      if: steps.warm-older.conclusion == 'success' && steps.warm-stack.outputs.cache-hit != 'true'
      id: warm-pack-stack
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/docker-images.tar.zst"
        bash scripts/ci-docker-images.sh save
        if [ -s "$RUNNER_TEMP/docker-images.tar.zst" ]; then echo "packed=true" >> "$GITHUB_OUTPUT"; fi
    - name: Save the stack's cache
      if: steps.warm-pack-stack.outputs.packed == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/docker-images.tar.zst
        key: ${{ steps.warm-keys.outputs.stack }}
    - name: Pack the job images
      if: steps.warm-older.conclusion == 'success' && steps.warm-jobs.outputs.cache-hit != 'true'
      id: warm-pack-jobs
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/docker-images.tar.zst"
        bash scripts/ci-docker-images.sh save jobs
        if [ -s "$RUNNER_TEMP/docker-images.tar.zst" ]; then echo "packed=true" >> "$GITHUB_OUTPUT"; fi
    - name: Save the job images' cache
      if: steps.warm-pack-jobs.outputs.packed == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/docker-images.tar.zst
        key: ${{ steps.warm-keys.outputs.jobs }}
