# The projection pass for large languages (decisions.md 103). The Edge
# Function's pass (every five minutes, server/projectionEdge.ts) leaves out
# the languages too big for its 256 MB; this runs the same pass for those,
# with Node's memory: Inbox rows, the public listing and server snapshots.
#
# Repo secret: V3_SERVICE_ROLE_KEY (this app's production service-role key,
# shared with v2-import.yml). The repository is public, so the log has counts
# only, never a language's name.
name: projections

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Read the code, nothing more: a compromised dependency in a job gets no
# write access to the repository through the token.
permissions:
  contents: read

concurrency:
  group: projections
  cancel-in-progress: false

jobs:
  large:
    if: github.repository == 'genesis-ai-dev/langquest-next'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      # No install scripts: this job holds the production service-role key, and a
      # package's postinstall would run beside it. Nothing here needs one.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Large languages
        env:
          SUPABASE_URL: https://xymxnebdwtbkfxlbylch.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.V3_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsx server/projections.ts
