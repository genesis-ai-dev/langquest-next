# Claude's nightly look at what came in about the tutorial videos
# (docs/tutorial-videos.md "Feedback", decisions.md 186): the comments on
# YouTube, the changes merged into main since its last look, and the notes
# the team left on the ops dashboard. Claude follows the tutorial-review
# skill (.agents/skills/tutorial-review/SKILL.md): it puts each comment into
# English with a reply the channel could post, and suggests changes to a
# video's script, screens or voice, to the app's code, or a new video. A
# person accepts, edits or rejects each on the ops dashboard.
#
# Claude signs in with a Claude plan's token (CLAUDE_CODE_OAUTH_TOKEN, made by
# `claude setup-token`, from .env.production through `npm run secrets --
# production`); anyone on the team can replace it with their own. Without it,
# or when Claude refuses it, the run fails with an annotation titled "Needs
# you: Claude token", which the ops dashboard lists under Needs attention
# (apps/admin/src/sources/github.ts). This workflow holds no production key: it reads
# and writes the feedback only through the app's Worker, which lets in this
# workflow on main by the OpenID Connect token GitHub gives the job
# (apps/web/worker/tutorialReview.ts; scripts/workflows.test.ts). Claude has
# no network and no token: the scripts around it fetch and send. Steps after
# Claude run the script as checked out, from a copy made before Claude, since
# Claude can write in the checkout. The look is checked before it is sent;
# when the Worker would refuse it, or lose part of it, Claude is asked once to
# mend it, with the problems listed (`check`). A look still refused leaves
# review.json with the run, for a person to read.
name: tutorial-review

on:
  schedule:
    # 10:00 UTC (3 AM Pacific): after the comments job at 23:50 UTC, and when
    # the team whose plan it runs on is asleep.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tutorial-review
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Without a Claude token, say so
        if: env.HAS_CLAUDE_TOKEN != 'true'
        # A block, since YAML takes the colon after the secret's name for a key.
        run: |
          echo "::error title=Needs you%3A Claude token::The nightly look at the tutorial videos' feedback has no CLAUDE_CODE_OAUTH_TOKEN. Run claude setup-token, then npm run env:update -- production CLAUDE_CODE_OAUTH_TOKEN and npm run secrets -- production. https://github.com/${{ github.repository }}/blob/main/docs/tutorial-videos.md#feedback"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with: { node-version-file: .node-version, package-manager-cache: false }
      - name: The script and the repository as checked out, for the steps after Claude
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/look/scripts" "$RUNNER_TEMP/look/server"
          cp scripts/tutorial-review.mjs "$RUNNER_TEMP/look/scripts/" && cp server/tutorialFeedback.ts "$RUNNER_TEMP/look/server/"
          cp -a .git "$RUNNER_TEMP/base.git"
      - name: What is open, and what main changed
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: node scripts/tutorial-review.mjs fetch .tutorial-review
      - name: Claude looks
        id: look
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # A scheduled run starts as the merge queue, the last to change this file.
          allowed_bots: github-merge-queue
          prompt: |
            Use the tutorial-review skill (.agents/skills/tutorial-review/SKILL.md). What is open is in .tutorial-review/state.json and the changes merged into main since the last look are in .tutorial-review/changes.json. Write your look to .tutorial-review/review.json, as the skill says, and nothing else.
          claude_args: --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
      - name: Check the look
        id: check
        if: env.HAS_CLAUDE_TOKEN == 'true'
        env:
          # git reads the commit from the copy: Claude could write in .git.
          GIT_DIR: ${{ runner.temp }}/base.git
        run: node "$RUNNER_TEMP/look/scripts/tutorial-review.mjs" check .tutorial-review
      # Once: the problems are in a file Claude reads, never in this prompt.
      - name: Claude mends the look
        id: mend
        if: steps.check.outputs.problems == 'yes'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-merge-queue
          prompt: |
            Use the tutorial-review skill (.agents/skills/tutorial-review/SKILL.md). Your look in .tutorial-review/review.json has the problems listed in .tutorial-review/problems.txt: the Worker would refuse it, or lose part of it. What is open is in .tutorial-review/state.json and the changes merged into main since the last look are in .tutorial-review/changes.json. Mend .tutorial-review/review.json, as the skill says, and change nothing else.
          claude_args: --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
      - name: Send the look
        if: env.HAS_CLAUDE_TOKEN == 'true'
        env:
          GIT_DIR: ${{ runner.temp }}/base.git
        run: node "$RUNNER_TEMP/look/scripts/tutorial-review.mjs" send .tutorial-review
      # What Claude wrote and what was wrong with it, when the look was not
      # taken: comments are public on YouTube, and a look names no author.
      - name: Keep the look that was not taken
        if: failure() && env.HAS_CLAUDE_TOKEN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tutorial-review
          path: |
            .tutorial-review/review.json
            .tutorial-review/problems.txt
          if-no-files-found: ignore
          retention-days: 14
      # Only when Claude's own answer says the token was refused: an expired
      # or revoked plan token, for the ops dashboard's Needs attention.
      - name: A Claude token that no longer works, say so
        if: failure() && (steps.look.outcome == 'failure' || steps.mend.outcome == 'failure')
        env:
          EXECUTION: ${{ steps.mend.outputs.execution_file || steps.look.outputs.execution_file }}
        run: |
          if [ -f "$EXECUTION" ] && grep -qiE 'authentication_error|invalid api key|oauth token (has expired|has been revoked)|invalid bearer token' "$EXECUTION"; then
            echo "::error title=Needs you%3A Claude token::Claude refused CLAUDE_CODE_OAUTH_TOKEN (expired or revoked). Run claude setup-token, then npm run env:update -- production CLAUDE_CODE_OAUTH_TOKEN and npm run secrets -- production. https://github.com/${{ github.repository }}/blob/main/docs/tutorial-videos.md#feedback"
          fi
