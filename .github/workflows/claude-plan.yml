# How much of this week's Frontier Claude plan is used, every hour, for the
# small monitor on the ops dashboard's Overview
# (docs/decisions/2026-11-21-the-overview-shows-the-frontier-claude-plan.md).
# scripts/claude-plan.mjs asks Claude Code one tiny question with the agent
# team's token (AGENT_TEAM_CLAUDE_TOKEN, the Frontier account, docs/agent-team.md)
# and leaves an annotation titled "Claude plan" with the share of the week
# used and when the week starts again; apps/admin/src/sources/claudePlan.ts
# reads the latest run's annotation. The token goes to Claude Code in its
# environment only, never as an argument. This workflow holds no production
# key and writes nothing: a late or dropped run only leaves an older number,
# and the Overview says how old.
name: claude-plan

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-plan
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/claude-plan.mjs
            .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - name: Read the plan
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AGENT_TEAM_CLAUDE_TOKEN }}
        run: node scripts/claude-plan.mjs
