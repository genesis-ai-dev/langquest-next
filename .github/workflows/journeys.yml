# Guardrails on every PR, so nothing depends on a local hook having run.
#
# checks:   the pre-push gate again (typecheck + unit and property tests).
# web-smoke: the release web build in three browser engines (smart-tests/web-smoke).
# journeys: Jev walks the avatar journeys (smart-tests/journeys) against the
#           web build and a local Supabase started here from the migrations.
#           smart-tests/env.sh reads its URL and keys from `supabase status`,
#           so no dotenvx key is needed.
#           Outcome oracles judge the device event log, blob store and server.
#
# Repo secret: OPENROUTER_API_KEY. Jev reads it as TYPESAFE_API_KEY and as its
# text-model key. Missing, the job fails; a journey that could not run is never a pass.
name: guardrails

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - name: Tell Linear (checks failed on main)
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/linear-sync.mjs lane --name checks --status failed --sha "$GITHUB_SHA" --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # Supabase deploys the committed worker bundle on merge (server/README.md,
      # Deploying); refuse one that is behind its source.
      - name: Worker bundle matches its source
        run: npm run worker:build && git diff --exit-code -- supabase/functions

  web-smoke:
    # The web as a published platform (decisions.md 58): the release web
    # build, served by the Worker as in production, against a local Supabase,
    # in Chromium (desktop and phone width), Firefox and WebKit. Deterministic:
    # no model. The build also holds the bundle-size budget.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    env:
      CI: 'true'
      SMOKE_PORT: '8787'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start Supabase (applies every migration)
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor
      # A new language needs a template, and templates live in the LangQuest
      # library (docs/library.md), which migrations do not create.
      - name: Publish the LangQuest library
        run: npm run library:seed
      - name: Smoke-test the web app
        shell: bash
        run: source smart-tests/env.sh && npx playwright test -c smart-tests/web-smoke.config.ts

  journeys:
    # Manual until smart-tests/world.ts seeds main's org > language model
    # (see smart-tests/README.md); then drop this `if` so every PR runs it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: checks
    env:
      CI: 'true'
      SMART_PORT: '8091'
      TYPESAFE_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UV: uv
    steps:
      - uses: actions/checkout@v4
      - name: Require journey secrets
        run: |
          [ -n "$OPENROUTER_API_KEY" ] \
            || { echo "::error::Set the OPENROUTER_API_KEY repo secret; journeys cannot judge without it."; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Supabase (applies every migration)
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor && npx supabase status
      - name: Walk the journeys
        run: smart-tests/run.sh
      - name: Keep the journey log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-results
          path: smart-tests/results
          if-no-files-found: ignore
