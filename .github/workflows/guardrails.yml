# Guardrails on every PR, so nothing depends on a local hook having run.
#
# scope:    which of server, web-smoke and ui-web the pull request's
#           changed files need (scripts/ci-scope.mjs, decisions.md 150);
#           none, when the commit already passed (decisions.md 164): a merge
#           queue entry whose tree the pull request's own run tested within
#           the hour, or a push of the commit that the merge queue passed.
# checks:   typecheck, lint, the server calls of store builds, the push
#           delivery bundle.
# unit:     the unit, property and model tests, in three shards dealt by
#           weight (scripts/unit-shards.ts); `coverage` merges their reports
#           and holds the thresholds (decisions.md 163).
# server:   the SQL smokes, SQL parity and client integration test against a
#           local Supabase started here from the migrations.
# web-smoke: the release web build in three browser engines (e2e/web-smoke).
# ui-web:   the P0 web UI tests (e2e/ui, `@p0`) on the release export
#           served by the Worker, against a local Supabase with the library
#           seeded and push delivery scheduled; the Worker runs the
#           projection pass in its job container (docs/testing.md),
#           in four shards of two browsers each (see ui-web below).
# nightly:  the whole web UI suite, a fleet scenario and Stryker on core,
#           on a schedule; not blocking, but each job files its failures in
#           Linear (scripts/nightly-report.mjs; a dry run off main). The
#           flake tracker reads the last runs' reports and files the tests
#           that do not pass every time (scripts/ui-flake-report.mjs).
# gate:     passes when checks, unit, coverage and every needed job passed;
#           the one check that main requires (.github/rulesets/main.json), on
#           the pull request and again in the merge queue. A green pull
#           request run's gate names the tree it tested, for the queue.
# warm-caches: on a push that runs no tests, fills the caches that pull
#           requests read from main (decisions.md 164).
#
# The PR jobs start together rather than after `checks`: a PR waits for
# the slowest job, not for `checks` plus it (decisions.md 102, amended
# 2026-10-15). The three that scope may leave out wait for it, about
# 20 seconds. A job that needs the local stack starts it in the background,
# loading the cached images first, and builds the web export and installs
# the browsers meanwhile (scripts/ci-background.sh, decisions.md 163).
#
# What keeps these jobs from failing for reasons outside the code
# (decisions.md 102, amended 2026-10-20):
#  - Concurrency: a pull request or a push cancels the run it replaces, and
#    nothing else cancels anything. The nightly has a group of its own, so a
#    push to main no longer cancels it (run 39360456537 was cancelled so).
#  - Registries: ECR Public and Docker Hub ration anonymous pulls per IP
#    address, which a GitHub-hosted runner shares (runs 39473313915 and
#    39360456537 failed with toomanyrequests). A start the registry turns
#    away is retried (scripts/ci-retry-pull.sh), and the Supabase CLI pulls
#    the same images from ghcr.io when ECR refuses. `server` and the nightly
#    jobs also restore the images from actions/cache first and save them when
#    the cache was not complete (.github/actions/docker-images); the browser
#    jobs pull instead, which was a minute faster than loading the 1.2 GB
#    archive (decisions.md 164). Optional secrets DOCKERHUB_USERNAME and
#    DOCKERHUB_TOKEN sign in to Docker Hub for a higher limit; without them
#    pulls are anonymous.
#  - Package mirror: Playwright's browsers need system packages, and the
#    runners' Ubuntu mirror has sent them at 20 kB/s (15 MB in 12 minutes on
#    a ui-web shard, and web-smoke's whole 30 minutes on 2026-10-22). Each
#    job installs them through .github/actions/playwright, which caches the
#    browsers and the packages, and stops a slow try after 4 minutes and
#    tries again (scripts/ci-playwright.sh).
#  - Load: the stack is about a dozen containers, and wrangler dev, the job
#    container and the browsers share a 4-vCPU runner. The stack leaves out
#    what the tests do not use (SUPABASE_EXCLUDE), ui-web runs two browsers
#    per runner, and every UI job records vmstat (scripts/ci-load.sh) into
#    its results artifact, under load/.
#
# e2e/env.sh reads the local stack's URL and keys from `supabase
# status`, so no dotenvx key is needed in any job.
name: guardrails

on:
  pull_request:
  # The merge queue: main as it will be with the pull requests ahead in the
  # queue, before it merges (.github/rulesets/main.json).
  merge_group:
  push:
    branches: [main, develop]
  schedule:
    # Nightly, 02:30 UTC: the jobs below with `if: nightly`.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly jobs too (whole UI suite, fleet, Stryker)
        type: boolean
        default: false

# Read the code, nothing more: a compromised dependency in a job gets no
# write access to the repository through the token.
permissions:
  contents: read

# A new push to a pull request, or to main, replaces the run it leaves behind
# (a merge queue entry has a ref of its own, so nothing replaces it).
# The scheduled and manual runs are a group of their own and are never
# cancelled, so a push cannot cancel the nightly and the nightly cannot cancel
# a push.
concurrency:
  group: guardrails-${{ contains(fromJSON('["pull_request","merge_group","push"]'), github.event_name) && 'ci' || 'nightly' }}-${{ github.ref }}
  cancel-in-progress: ${{ contains(fromJSON('["pull_request","push"]'), github.event_name) }}

env:
  # What `supabase start` leaves out in every job: none of it is used by the
  # tests, and each is an image to pull and a container to run.
  SUPABASE_EXCLUDE: studio,imgproxy,vector,logflare,supavisor

# main requires one check, `gate` (.github/rulesets/main.json, decisions.md
# 150). `scope` says which of `server`, `web-smoke` and `ui-web` the pull
# request's changed files need (scripts/ci-scope.mjs); the others are
# skipped. `gate` passes only when `checks`, `unit`, `coverage` and every
# needed job passed.
# A job that runs on a pull request is in `gate`'s needs;
# scripts/githubRules.test.ts fails until it is.
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads, to tell whether this commit already passed (scripts/ci-tested.mjs):
    # the artifacts that name a tested tree, and the gate checks on a commit.
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      server: ${{ steps.scope.outputs.server }}
      web-smoke: ${{ steps.scope.outputs.web-smoke }}
      ui-web: ${{ steps.scope.outputs.ui-web }}
      # The run that already passed this tree or commit, or empty: then no job runs.
      tested: ${{ steps.scope.outputs.tested }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs

  checks:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.tested == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The server-calls step reads main's history since the oldest
        # supported store build.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # What may import what (decisions.md 104, 105): eslint.config.mjs.
      - run: npm run lint
      # Every server call that a supported store build or an OTA update sent
      # to one makes is still there after this change (scripts/server-calls.mjs,
      # decisions.md 151). With EXPO_TOKEN the builds come from EAS; without
      # it, from apps/mobile/store-builds.json.
      - name: Server calls that store builds make
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run --silent server-calls
      # Supabase deploys the committed push delivery bundle on merge (server/README.md,
      # Deploying); refuse one that is behind its source. The pre-commit and
      # post-merge hooks (.githooks, enabled by npm install) rebuild it, so
      # this fails only for a commit made without them (or a rebase).
      - name: Push delivery bundle matches its source
        run: |
          npm run build:push-delivery
          git diff --exit-code -- supabase/functions || {
            echo "::error::The push delivery function's bundle (supabase/functions/push-delivery) is behind its source. Run npm run build:push-delivery and commit supabase/functions, or run npm install once so the git hooks in .githooks rebuild it on every commit."
            exit 1
          }

  unit:
    # The unit, property and model tests with coverage, in three shards that
    # scripts/unit-shards.ts deals by weight. The suite is CPU-bound: 4.5
    # minutes on one 4-vCPU runner, its slowest file (the organization folder's
    # memory test) about a third of that. Each shard keeps a blob report with
    # its coverage, and `coverage` merges them.
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.tested == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Unit tests (shard ${{ matrix.shard }} of 3)
        env:
          VITEST_COVERAGE_SHARD: '1'
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/3 --reporter=blob --reporter=default
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest/blob/*
          include-hidden-files: true
          retention-days: 1

  coverage:
    # The shards' reports as one, and the coverage thresholds on the whole
    # suite: core and sync have them (vitest.config.ts).
    needs: [scope, unit]
    if: ${{ !cancelled() && needs.scope.outputs.tested == '' && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: unit-blob-*
          path: .vitest/blob
          merge-multiple: true
      - name: Coverage of the whole suite
        run: npx vitest run --merge-reports --coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  server:
    # The server against a local Supabase built from the migrations: the SQL
    # smokes, the SQL parity check against core's folds (npm run db:test), the
    # client integration test (npm run test:integration), and, when the pull
    # request changes a migration, the sync test from each store build's
    # commit (npm run test:old-sync).
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The store builds' sync tests take their code out of main's history.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Keep the stack's ports out of the outbound port range
        run: bash scripts/ci-reserve-ports.sh
      - uses: ./.github/actions/docker-images
        with: { phase: restore }
      - name: Start Supabase (applies every migration)
        run: bash scripts/ci-retry-pull.sh npx supabase start -x "$SUPABASE_EXCLUDE"
      - name: SQL smokes and parity
        run: npm run db:test
      - name: Client integration test
        run: npm run test:integration
      # Older store builds keep syncing with this pull request's database
      # (scripts/old-sync-tests.mjs, decisions.md 152). Only a pull request
      # (or a merge queue entry) that changes supabase/migrations runs them,
      # about two minutes.
      - name: Sync tests from the store builds
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run test:old-sync
      - uses: ./.github/actions/docker-images
        if: always()
        with: { phase: save }

  web-smoke:
    # The web as a published platform (decisions.md 58): the release web
    # build, served by the Worker as in production, against a local Supabase,
    # in Chromium (desktop and phone width), Firefox and WebKit. Deterministic:
    # no model. The build also holds the bundle-size budget.
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.web-smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      SMOKE_PORT: '8787'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Record the runner's load
        run: bash scripts/ci-load.sh start "$RUNNER_TEMP/load"
      - name: Keep the stack's ports out of the outbound port range
        run: bash scripts/ci-reserve-ports.sh
      # The stack pulls its images and starts in the background, while the
      # export builds and the browsers install (decisions.md 163). No image
      # cache: pulling was faster than loading it (decisions.md 164).
      - name: Start Supabase in the background (pulls its images, applies every migration)
        run: bash scripts/ci-background.sh start stack bash scripts/ci-retry-pull.sh npx supabase start -x "$SUPABASE_EXCLUDE"
      # The development export needs only the stack's URL and anon key, which
      # are fixed and in apps/mobile/.env.development; e2e/export-web.sh keeps
      # it only if the running stack agrees. The build holds the budget.
      - name: Build the web export in the background
        run: bash scripts/ci-background.sh start export env NO_SPEECH_MODEL=1 npm run export:web -w mobile -- development
      - uses: ./.github/actions/playwright
        with: { browsers: chromium firefox webkit }
      - name: Wait for the web export
        run: bash scripts/ci-background.sh wait export
      - name: Wait for Supabase
        run: bash scripts/ci-background.sh wait stack
      # A new language needs a template, and templates live in the LangQuest
      # library (docs/library.md), which migrations do not create.
      - name: Publish the LangQuest library
        run: npm run library:seed
      - name: Smoke-test the web app
        shell: bash
        env:
          WEB_EXPORTED: '1'
        run: source e2e/env.sh && npx playwright test -c e2e/web-smoke.config.ts
      - name: Keep the runner's load record
        if: always()
        run: bash scripts/ci-load.sh stop "$RUNNER_TEMP/load" e2e/results/load
      # What the page showed when a step failed (error-context.md), so a CI-only failure can be read.
      - name: Keep the smoke results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-smoke-results
          path: e2e/results
          if-no-files-found: ignore

  ui-web:
    # The P0 web UI tests on the release export (docs/testing.md, layer 4):
    # the build people get, served by the Worker, against a local Supabase
    # with the library and push delivery as `npm run db:start` leaves them,
    # and the projection pass in the Worker's job container, its tick fired
    # every minute (e2e/ui-web.sh, decisions.md 148). Zero retries; a red
    # run is a finding, not a flake to hide.
    # Four shards of two browsers each, one runner per shard. One runner
    # held the stack (about a dozen containers), wrangler dev, the job
    # container and four browsers on 4 vCPUs, and tests ran 2 to 9 times
    # slower than on a laptop; the shard with the recording, reviewing, sync
    # and journey files had 19 of the 21 failures in 144 runs. Half the
    # browsers per runner and twice the runners keep the wall time about the
    # same. The shards are cut by recorded duration, not by test count
    # (Playwright's --shard deals by count in file order, which put 154 s of
    # recording tests in one shard and 47 s of home-screen tests in the
    # other): scripts/ui-shards.mjs deals spec files by their seconds in
    # scripts/ui-shard-weights.json, which is refreshed from the reports of
    # kept runs (its header says how).
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.ui-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
      UI_PORT: '8787'
      UI_WORKERS: '2'
      SHARDS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Record the runner's load
        run: bash scripts/ci-load.sh start "$RUNNER_TEMP/load"
      - name: Keep the stack's ports out of the outbound port range
        run: bash scripts/ci-reserve-ports.sh
      # As in web-smoke: the job container's images (with retries) and the
      # stack's are pulled and the stack starts in the background, while the
      # export builds.
      - name: Start the local stack in the background (pulls, migrations, library, push delivery)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/ci-background.sh start stack bash -c 'bash scripts/ci-docker-images.sh warm && bash scripts/ci-retry-pull.sh npm run db:start'
      - name: Build the web export in the background
        run: bash scripts/ci-background.sh start export env NO_SPEECH_MODEL=1 npm run export:web -w mobile -- development
      - uses: ./.github/actions/playwright
        with: { browsers: chromium }
      - name: Wait for the web export
        run: bash scripts/ci-background.sh wait export
      - name: Wait for the local stack
        run: bash scripts/ci-background.sh wait stack
      - name: P0 web UI tests on the export (shard ${{ matrix.shard }} of 4)
        shell: bash
        env:
          WEB_EXPORTED: '1'
        run: |
          files="$(node scripts/ui-shards.mjs "${{ matrix.shard }}" "$SHARDS" --tag @p0)"
          npm run test:ui:web -- --grep @p0 --grep-invert @quarantine $files
      - name: Keep the runner's load record
        if: always()
        run: bash scripts/ci-load.sh stop "$RUNNER_TEMP/load" e2e/results/ui/load
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-web-p0-results-${{ matrix.shard }}
          path: |
            e2e/results/ui/report.json
            e2e/results/ui/load/*
            e2e/results/ui/**/*.png
            e2e/results/ui/**/error-context.md
          if-no-files-found: ignore

  gate:
    # The one check that main requires. A job that the changed files do not
    # need is skipped and counts as passed; a needed job must have passed.
    # It runs whatever the others did (always()), so a failure or a cancel
    # fails it instead of leaving it skipped, which GitHub would count as a
    # pass.
    needs: [scope, checks, unit, coverage, server, web-smoke, ui-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        id: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const always = ["checks", "unit", "coverage"];
            const tested = needs.scope.outputs.tested;
            if (tested) console.log(`Already passed, so no job ran: ${tested}`);
            const needed = (job) => !tested && (always.includes(job) || needs.scope.outputs[job] === "true");
            let bad = needs.scope.result === "success" ? [] : [`scope ${needs.scope.result}`];
            for (const [job, { result }] of Object.entries(needs)) {
              if (job === "scope") continue;
              if (needed(job) ? result !== "success" : !["success", "skipped"].includes(result)) bad.push(`${job} ${result}`);
              else console.log(`${job}: ${result}${needed(job) ? "" : " (not needed)"}`);
            }
            const checksFailed = always.some((job) => needs[job].result === "failure");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `checks-failed=${checksFailed}\n`);
            if (bad.length) { console.log(`::error::Not every needed job passed: ${bad.join(", ")}`); process.exit(1); }
          '
      # checks, unit or coverage failed on main: the deploy lanes wait on them (decisions.md 53).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: failure() && github.event_name == 'push' && steps.verdict.outputs.checks-failed == 'true'
        with: { sparse-checkout: scripts }
      - name: Tell Linear (checks failed on main)
        if: failure() && github.event_name == 'push' && steps.verdict.outputs.checks-failed == 'true'
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/linear-sync.mjs lane --name checks --status failed --sha "$GITHUB_SHA" --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # A green pull request run names the tree it tested (the pull request
      # merged with main), so the merge queue can take this run for its
      # entry when main has not moved since (scripts/ci-tested.mjs,
      # decisions.md 164). A day is plenty: the queue takes it for an hour.
      - name: The tree this run tested
        id: tree
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          printf '{"run":"%s","commit":"%s","tree":"%s"}\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_SHA" "$tree" > "$RUNNER_TEMP/tested-tree.json"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Name it for the merge queue
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree.json
          retention-days: 1

  warm-caches:
    # A push that the merge queue already passed runs no tests (scope's
    # `tested`), but caches saved on main are the only ones a pull request
    # can read: a pull request's and a merge queue entry's are their own.
    # Without this, a change to a cache's key (Playwright, the lockfile, the
    # Supabase CLI or its config for `server`'s images) would make every pull
    # request install from the slow package mirror, or `server` pull from the
    # rationed registries, until the nightly ran (decisions.md 102, amended
    # 2026-10-20; decisions.md 164). A cache that is there is only looked up,
    # so this is about a minute on most pushes.
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.tested != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The npm cache, saved after the job when the lockfile changed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: ./.github/actions/playwright
        with: { browsers: chromium, warm: 'true' }
      - uses: ./.github/actions/playwright
        with: { browsers: chromium firefox webkit, warm: 'true' }
      - name: Keep the stack's ports out of the outbound port range
        run: bash scripts/ci-reserve-ports.sh
      - uses: ./.github/actions/docker-images
        with:
          phase: warm
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  nightly-ui-web:
    # The whole web UI suite, quarantine apart. Not blocking; its failures go to Linear.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
      UI_PORT: '8787'
      # Two browsers, as in ui-web: the run is not waited for, so it can be slower and steadier.
      UI_WORKERS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Record the runner's load
        run: bash scripts/ci-load.sh start "$RUNNER_TEMP/load"
      - name: Keep the stack's ports out of the outbound port range
        run: bash scripts/ci-reserve-ports.sh
      - uses: ./.github/actions/docker-images
        with:
          phase: restore
          job-images: 'true'
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/playwright
        with: { browsers: chromium }
      - name: Start the local stack (migrations, library, push delivery)
        run: bash scripts/ci-retry-pull.sh npm run db:start
      - name: The whole web UI suite
        shell: bash
        run: npm run test:ui:web -- --grep-invert @quarantine
      - name: Keep the runner's load record
        if: always()
        run: bash scripts/ci-load.sh stop "$RUNNER_TEMP/load" e2e/results/ui/load
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-web-nightly-results
          path: |
            e2e/results/ui/report.json
            e2e/results/ui/load/*
            e2e/results/ui/**/*.png
            e2e/results/ui/**/error-context.md
          if-no-files-found: ignore
      - uses: ./.github/actions/docker-images
        if: always()
        with: { phase: save, job-images: 'true' }
      # An issue per failing test, or one for the run when it broke as a whole.
      - name: Tell Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          JOB_STATUS: ${{ job.status }}
          DRY: ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
        run: node scripts/nightly-report.mjs ui --status "$JOB_STATUS" --sha "$GITHUB_SHA" --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" $DRY

  nightly-quarantine:
    # The quarantined tests, on their own, so their pass rate is visible
    # (scripts/ui-flakes.mjs over the kept reports) without blocking anything.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      CI: 'true'
      UI_PORT: '8787'
      UI_WORKERS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Record the runner's load
        run: bash scripts/ci-load.sh start "$RUNNER_TEMP/load"
      - name: Keep the stack's ports out of the outbound port range
        run: bash scripts/ci-reserve-ports.sh
      - uses: ./.github/actions/docker-images
        with:
          phase: restore
          job-images: 'true'
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/playwright
        with: { browsers: chromium }
      - name: Start the local stack (migrations, library, push delivery)
        run: bash scripts/ci-retry-pull.sh npm run db:start
      - name: Quarantined web UI tests
        shell: bash
        run: npm run test:ui:web -- --grep @quarantine
      - name: Keep the runner's load record
        if: always()
        run: bash scripts/ci-load.sh stop "$RUNNER_TEMP/load" e2e/results/ui/load
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-web-quarantine-results
          path: |
            e2e/results/ui/report.json
            e2e/results/ui/load/*
          if-no-files-found: ignore
      - uses: ./.github/actions/docker-images
        if: always()
        with: { phase: save, job-images: 'true' }

  nightly-flakes:
    # The tests that do not pass every run. Retries are off, so a flake only
    # shows over many runs: this reads the ui-web report artifacts of the last
    # 40 pull request and push runs (scripts/ui-flake-report.mjs), prints the
    # tests under 95% (seen in at least 5 runs) and keeps one Linear issue for
    # them, commenting when the list changes. Not blocking, and it needs no
    # dependency, so no npm ci.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      # Lists runs and downloads their artifacts; nothing is written to GitHub.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Pass rates of the last runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DRY: ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
        run: node scripts/ui-flake-report.mjs --runs 40 --threshold 0.95 --min 5 --sha "$GITHUB_SHA" --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" $DRY

  nightly-fleet:
    # A fleet of phones on simulated time (docs/fleet-simulation.md): the
    # sync code's cost, kept as a number to compare with docs/fleet-baselines.md.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run fleet -- normalDay --json=fleet-normalDay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleet-normalDay
          path: fleet-normalDay.json
      - name: Tell Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          JOB_STATUS: ${{ job.status }}
          DRY: ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
        run: node scripts/nightly-report.mjs job --name nightly-fleet --status "$JOB_STATUS" --sha "$GITHUB_SHA" --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" $DRY

  nightly-mutation:
    # Stryker over packages/core (docs/testing.md): a test would notice a
    # line changing, not just that it ran. The score is in the report.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Stryker's incremental file, so a night only re-tests what changed (about 7 min from cold on 7 workers).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-core-${{ github.sha }}
          restore-keys: stryker-core-
      - run: npm run test:mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-core
          path: reports/mutation
          if-no-files-found: ignore
      - name: Tell Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          JOB_STATUS: ${{ job.status }}
          DRY: ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
        run: node scripts/nightly-report.mjs job --name nightly-mutation --status "$JOB_STATUS" --sha "$GITHUB_SHA" --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" $DRY
