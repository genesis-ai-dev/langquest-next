<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v2 → Next transfers</title>
<style>
  :root {
    --bg: #f5f4f9; --panel: #fff; --text: #1d1b26; --muted: #6e6b7d; --faint: #9a97a8; --line: #e6e4ee;
    --purple: #6b4fd8; --purple-soft: #efeafe; --blue: #2563eb; --blue-soft: #e5edfd;
    --green: #1d8048; --green-soft: #e2f3e8; --amber: #a35f00; --amber-soft: #fdf0d9; --red: #c0262d; --red-soft: #fde8e8; --grey-soft: #efeef3;
    --shadow: 0 1px 2px rgba(25,15,70,.06), 0 1px 1px rgba(25,15,70,.04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 12px; }
  button:hover:not(:disabled) { border-color: var(--purple); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--purple); border-color: var(--purple); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.link { border: 0; background: none; color: var(--purple); padding: 0; }

  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 14px; padding: 12px 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--purple); color: #fff; display: grid; place-items: center; font-size: 14px; }
  .env { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--grey-soft); color: var(--muted); letter-spacing: .02em; }
  .env.production { background: var(--red); color: #fff; }
  .env.hosted { background: var(--amber-soft); color: var(--amber); }
  .kpis { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; background: var(--panel); text-align: left; min-width: 118px; }
  .kpi b { display: block; font-size: 18px; line-height: 1.1; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .kpi.alert b { color: var(--red); }
  .kpi.live b { color: var(--blue); }
  .tools { display: flex; align-items: center; gap: 10px; padding: 0 20px 12px; flex-wrap: wrap; }
  .tools input[type=search] { flex: 0 1 300px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 6px 11px; color: var(--muted); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--purple-soft); color: var(--purple); font-weight: 600; }
  .seg button .n { color: var(--faint); font-weight: 400; margin-left: 4px; }
  .tools label { color: var(--muted); display: flex; gap: 6px; align-items: center; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px 20px 60px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } aside { position: static !important; max-height: none !important; } }
  .notice { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--amber-soft); color: var(--amber); }
  .notice.error { background: var(--red-soft); color: var(--red); }

  .lane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .lane.drop { outline: 2px dashed var(--purple); outline-offset: 2px; }
  .lane.skip { background: #fafafc; }
  .lane-head { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .lane-head .chev { border: 0; background: none; padding: 2px 4px; color: var(--muted); grid-row: span 2; }
  .org-name { font: inherit; font-weight: 700; font-size: 15px; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; margin-left: -6px; background: transparent; min-width: 60px; width: 100%; max-width: 420px; }
  .org-name:hover { border-color: var(--line); }
  .org-name:focus { outline: none; border-color: var(--purple); background: var(--panel); }
  .lane-meta { color: var(--muted); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .lane-act { grid-row: span 2; display: flex; gap: 8px; align-items: center; }
  .meter { display: inline-flex; align-items: center; gap: 8px; }
  .bar { height: 6px; border-radius: 3px; background: var(--grey-soft); overflow: hidden; width: 120px; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .4s; }
  .bar.live i { background: var(--blue); }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px 16px; min-height: 56px; }
  .lane.closed .cards { display: none; }
  .empty { color: var(--faint); padding: 6px 2px; }

  .card { width: 252px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; position: relative; cursor: pointer; }
  .card[draggable=true] { cursor: grab; }
  .card::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c, var(--line)); }
  .card:hover { border-color: #cfcadf; }
  .card.inactive { opacity: .55; }
  .card .t { font-weight: 650; word-break: break-word; padding-right: 18px; }
  .card .lock { position: absolute; right: 10px; top: 10px; font-size: 12px; color: var(--faint); }
  .card .sub { color: var(--muted); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--grey-soft); color: var(--muted); font-size: 12px; white-space: nowrap; border: 1px solid transparent; }
  button.chip { cursor: pointer; }
  button.chip:hover { border-color: currentColor; }
  .c-keep, .c-high, .c-decided { background: var(--green-soft); color: var(--green); }
  .c-medium { background: var(--amber-soft); color: var(--amber); }
  .c-low { background: #fde9d9; color: #b4530b; }
  .c-review, .c-none { background: var(--grey-soft); color: var(--muted); }
  .state { font-size: 13px; display: flex; align-items: center; gap: 6px; min-height: 20px; }
  .state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); flex-shrink: 0; }
  .state.live .dot { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .card .bar { width: 100%; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .people { color: var(--muted); font-size: 12px; }
  .people b { color: var(--green); font-weight: 600; }
  .s-place { --c: #c9c5d6; } .s-language { --c: var(--amber); } .s-ready, .s-confirmed { --c: var(--purple); }
  .s-queued, .s-running { --c: var(--blue); } .s-done { --c: var(--green); } .s-issues, .s-stopped { --c: var(--red); } .s-skip { --c: #dedbe6; }
  .why { color: var(--faint); font-size: 12px; }
  .issues-chip { background: var(--red-soft); color: var(--red); }

  aside { position: sticky; top: 132px; max-height: calc(100vh - 150px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; padding: 11px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--purple); border-bottom-color: var(--purple); font-weight: 600; }
  .feed-tools { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .feed { overflow-y: auto; flex: 1; }
  .line { display: grid; grid-template-columns: 44px 1fr; gap: 2px 8px; padding: 8px 12px; border-bottom: 1px solid #f1f0f5; cursor: pointer; }
  .line:hover { background: #faf9fd; }
  .line time { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .line .who { font-size: 12px; color: var(--muted); }
  .line .msg { grid-column: 2; }
  .line.done .msg { color: var(--green); }
  .line.warn .msg { color: var(--amber); }
  .line.error .msg { color: var(--red); }
  .person { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f1f0f5; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--purple-soft); color: var(--purple); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .person .sub { color: var(--muted); font-size: 12px; }
  .person .email { font-size: 12px; user-select: all; overflow-wrap: anywhere; }

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(20,10,60,.12); z-index: 30; display: flex; flex-direction: column; transform: translateX(105%); transition: transform .2s; }
  .drawer.open { transform: none; }
  .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .drawer-head h2 { margin: 0; font-size: 18px; }
  .drawer-body { overflow-y: auto; padding: 4px 0 30px; }
  .drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 16px 18px 6px; }
  .issue { margin: 6px 18px; padding: 8px 10px; border-radius: 8px; background: var(--red-soft); color: var(--red); font-size: 13px; }
  .issue.warn { background: var(--amber-soft); color: var(--amber); }
  .x { position: absolute; right: 14px; top: 14px; border: 0; font-size: 18px; color: var(--muted); }

  .scrim { position: fixed; inset: 0; background: rgba(20,15,40,.35); z-index: 40; display: grid; place-items: center; }
  .modal { background: var(--panel); border-radius: 14px; width: min(440px, calc(100vw - 32px)); padding: 20px; box-shadow: 0 20px 48px rgba(20,10,60,.25); display: flex; flex-direction: column; gap: 10px; }
  .modal h2 { margin: 0; font-size: 17px; }
  .modal p { margin: 0; color: var(--muted); }
  .modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .modal input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .picker { position: fixed; z-index: 50; width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(20,10,60,.18); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .picker input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .opt { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .opt:hover, .opt:focus { background: var(--purple-soft); outline: none; }
  .opt .why { display: block; }
  .block { margin: 0 18px; display: flex; flex-direction: column; gap: 10px; }
  .field { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .field input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font: inherit; color: var(--text); }
  .known { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; margin: 0; padding: 10px 12px; background: #faf9fd; border-radius: 10px; font-size: 13px; }
  .known dt { color: var(--faint); }
  .known dd { margin: 0; word-break: break-word; }
  #findLanguage { padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
  #findLanguage:focus { outline: none; border-color: var(--purple); }
  .result { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
  .result.on { border-color: var(--green); background: var(--green-soft); }
  .result.plain { border-style: dashed; }
  .result input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; font: inherit; }
  .result .sub, .person .sub { color: var(--muted); font-size: 12px; }
  select.role { font: inherit; font-size: 13px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-width: 170px; }
  .admins { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip-x { border: 0; background: none; padding: 0 0 0 2px; color: inherit; font-size: 11px; opacity: .7; }
  .chip-x:hover { opacity: 1; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 9px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; z-index: 60; pointer-events: none; }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><span class="logo">LQ</span> v2 → Next transfers</div>
    <span class="env" id="env">…</span>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="Find a project, person or language">
    <div class="seg" id="filters"></div>
    <label><input type="checkbox" id="showOff"> Show projects v2 turned off</label>
    <button class="small" id="refresh" title="Read v2's projects and members again">Refresh from v2</button>
  </div>
</header>
<div class="layout">
  <main id="main"><div class="empty">Reading v2…</div></main>
  <aside>
    <div class="tabs"><button class="on" data-tab="activity">Activity</button><button data-tab="people">Signed in</button></div>
    <div class="feed-tools" id="feedTools"></div>
    <div class="feed" id="feed"></div>
  </aside>
</div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<script>
const SKIP = 'skip';
const S = {
  cards: [], orgs: [], members: {}, signedIn: {}, nameOf: {}, emailOf: {}, roles: {}, by: '', where: 'local',
  passes: new Map(), queue: new Set(), log: [], after: 0, signedInCount: 0,
  filter: 'all', tab: 'activity', feedIssues: false, closed: new Set(), open: null, people: null
};
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const fmt = new Intl.NumberFormat();
const ago = (iso) => {
  if (!iso) return '';
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
};
const clock = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
const day = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
const plural = (n, one, many = one + 's') => `${fmt.format(n)} ${n === 1 ? one : many}`;
function toast(text) { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

// ---- reading -----------------------------------------------------------------------
async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const out = await res.json();
  if (!res.ok) throw new Error(out.error || res.status);
  return out;
}
async function loadBoard(fresh) {
  try {
    const d = await api('/api/board' + (fresh ? '?fresh' : ''));
    Object.assign(S, { cards: d.cards, orgs: d.orgs, members: d.members, signedIn: d.signedIn, nameOf: d.nameOf, emailOf: d.emailOf ?? {}, roles: d.roles ?? {}, by: d.by, where: d.where, everyLanguage: d.everyLanguage });
    const env = $('#env');
    env.textContent = d.where === 'production' ? 'PRODUCTION' : d.where === 'local' ? 'Local test database' : d.host;
    env.className = 'env ' + d.where;
    render();
  } catch (e) { $('#main').replaceChildren(el('div', { class: 'notice error' }, `Could not read v2: ${e.message}`)); }
}
async function poll() {
  try {
    const st = await api('/api/status?after=' + S.after);
    S.passes = new Map(st.passes.map((p) => [p.project_id, p]));
    const wasBusy = S.queue.size;
    S.queue = new Set(st.queue);
    S.signedInCount = st.signed_in;
    if (st.log.length) {
      S.log = [...st.log.reverse(), ...S.log].slice(0, 600);
      S.after = Math.max(S.after, ...st.log.map((l) => l.id));
    }
    // A transfer that finished here may have confirmed or changed what the board shows.
    if (wasBusy && !S.queue.size) loadBoard();
    else render();
  } catch { /* the next poll tries again */ }
  setTimeout(poll, busy() ? 1500 : 6000);
}
const busy = () => S.queue.size > 0 || [...S.passes.values()].some((p) => !p.finished_at && fresh(p));
const fresh = (p) => Date.now() - Date.parse(p.progress_at) < 120000;

// ---- what each project is doing ------------------------------------------------------
const orgName = (id) => id === SKIP ? "Not coming over" : S.orgs.find((o) => o.org_id === id)?.name ?? id;
const personName = (id) => S.nameOf[id] ?? (S.everyLanguage?.includes(id) ? 'Every Language' : `Person ${id.slice(0, 8)}`);
const personEmail = (id) => S.emailOf[id] ?? '';
function language(c) {
  const r = c.recommendation;
  if (c.code) return { text: c.languoidId && c.languoidId === r.languoidId && r.name ? `${r.name} [${c.code}]` : c.code, cls: 'c-decided', sure: true, title: 'Chosen here' };
  if (r.decision) return { text: 'chosen in the CSV', cls: 'c-decided', sure: true, title: r.reason };
  if (r.code) return { text: `${r.name ?? r.code} [${r.code}]`, conf: r.confidence, cls: `c-${r.confidence}`, sure: ['keep', 'high'].includes(r.confidence) && !!r.languoidId, title: `Suggested (${r.confidence}): ${r.reason}` };
  return { text: 'Choose a language', cls: 'c-none', sure: false, title: r.reason };
}
function issuesOf(pass) {
  if (!pass) return [];
  const out = [];
  if (pass.error) out.push({ level: 'error', text: `Stopped: ${pass.error}` });
  const r = pass.report || {};
  if (r.rejected?.length) out.push({ level: 'error', text: `${plural(r.append?.rejected ?? r.rejected.length, 'change')} refused: ${r.rejected[0].reason}`, list: r.rejected });
  if (r.files?.missing) out.push({ level: 'warn', text: `${plural(r.files.missing, 'audio file')} not in v2's storage` });
  if (r.map?.waiting) out.push({ level: 'warn', text: `${plural(r.map.waiting, 'recording')} waiting for audio to reach v2` });
  if (r.map?.unmatchedQuests) out.push({ level: 'warn', text: `${plural(r.map.unmatchedQuests, 'quest')} not matched to the Bible (came over as parts of their own)` });
  return out;
}
const STEP = { reading: 'Reading v2', files: 'Copying audio', uploading: 'Storing audio', events: 'Adding to Next', done: 'Finishing' };
function stateOf(c) {
  const pass = S.passes.get(c.id);
  const issues = issuesOf(pass && pass.finished_at ? pass : null).filter((i) => i.level === 'error');
  if (c.orgId === SKIP) return { key: 'skip', text: 'Not coming over' };
  if (pass && !pass.finished_at && fresh(pass)) {
    const p = pass.progress || {};
    const pct = p.total ? Math.round((100 * (p.done || 0)) / p.total) : null;
    return { key: 'running', live: true, text: `${STEP[p.step] || 'Starting'}${p.total ? ` · ${fmt.format(p.done || 0)} of ${fmt.format(p.total)}` : ''}`, pct };
  }
  if (S.queue.has(c.id)) return { key: 'queued', live: true, text: 'Waiting its turn' };
  if (pass && !pass.finished_at) return { key: 'stopped', text: `Stopped while ${(STEP[pass.progress?.step] || 'starting').toLowerCase()}` };
  if (pass?.error) return { key: 'issues', text: 'Stopped with an error' };
  if (pass?.last_done) return issues.length ? { key: 'issues', text: `In Next · ${plural(issues.length, 'issue')}` } : { key: 'done', text: `In Next · ${ago(pass.last_done)}` };
  if (c.confirmed) return { key: 'confirmed', text: 'Confirmed, not transferred yet' };
  if (!language(c).sure) return { key: 'language', text: 'Choose its language first' };
  return { key: 'ready', text: 'Ready to transfer' };
}
const FILTERS = [
  ['all', 'All', () => true],
  ['ready', 'Ready', (s) => ['ready', 'confirmed', 'language'].includes(s)],
  ['running', 'Transferring', (s) => ['running', 'queued'].includes(s)],
  ['done', 'In Next', (s) => ['done', 'issues'].includes(s)],
  ['issues', 'Issues', (s) => ['issues', 'stopped'].includes(s)],
  ['skip', 'Not coming over', (s) => s === 'skip']
];
const peopleOf = (c) => {
  const m = S.members[c.id] || [];
  return { total: m.length, signed: m.filter((x) => S.signedIn[x.id]).length };
};

// ---- the page ---------------------------------------------------------------------------
function render() {
  const states = new Map(S.cards.map((c) => [c.id, stateOf(c)]));
  const count = (pred) => S.cards.filter((c) => (S.showOff || c.active) && pred(states.get(c.id).key)).length;

    el('button', { class: 'kpi' + (running ? ' live' : ''), onclick: () => setFilter('running') }, el('b', {}, fmt.format(running)), el('span', {}, 'transferring now')),
    el('button', { class: 'kpi' + (withIssues ? ' alert' : ''), onclick: () => setFilter('issues') }, el('b', {}, fmt.format(withIssues)), el('span', {}, 'with issues')),
    el('button', { class: 'kpi', onclick: () => setTab('people') }, el('b', {}, fmt.format(S.signedInCount)), el('span', {}, S.signedInCount === 1 ? 'person signed in' : 'people signed in'))
  );

  const q = $('#q').value.trim().toLowerCase();
  const pred = FILTERS.find((f) => f[0] === S.filter)[2];
  const shown = S.cards.filter((c) => (S.showOff || c.active) && pred(states.get(c.id).key) && (!q || [c.name, c.code ?? '', c.recommendation.name ?? '', orgName(c.orgId), ...(S.members[c.id] || []).flatMap((m) => [personName(m.id), personEmail(m.id)])].join(' ').toLowerCase().includes(q)));
  const byOrg = new Map();
  for (const c of shown) (byOrg.get(c.orgId) ?? byOrg.set(c.orgId, []).get(c.orgId)).push(c);
  const size = (id) => (byOrg.get(id) ?? []).reduce((n, c) => n + c.assets, 0);
  const ids = S.orgs.map((o) => o.org_id).filter((id) => byOrg.has(id) || (!q && S.filter === 'all'))
    .sort((a, b) => (a === 'org-v2-everylanguage' ? -1 : b === 'org-v2-everylanguage' ? 1 : size(b) - size(a) || orgName(a).localeCompare(orgName(b))));
  if (byOrg.has(SKIP)) ids.push(SKIP);

  const scroll = window.scrollY;

  window.scrollTo(0, scroll);
  renderFeed();

  if (S.open && !$('#drawer').contains(document.activeElement)) renderDrawer();
}

function lane(orgId, cards, states) {
  const org = S.orgs.find((o) => o.org_id === orgId);
  const all = S.cards.filter((c) => c.orgId === orgId && (S.showOff || c.active));

  const toSend = all.filter((c) => ['ready', 'confirmed', 'stopped', 'done', 'issues'].includes(states.get(c.id).key));
  const fresh = toSend.filter((c) => !['done', 'issues'].includes(states.get(c.id).key));

  dropTarget(node, (id) => move(id, orgId));
  return node;
}

function newLane() {
  const node = el('section', { class: 'lane' }, el('div', { class: 'cards' }, el('div', { class: 'empty' }, 'Drop a project here to start a new organization')));
  dropTarget(node, (id) => {

      if (!name) return;

      S.orgs.push({ org_id: orgId, name, existing: false, admins: c ? (S.members[c.id] || []).filter((m) => m.owner).map((m) => m.id).slice(0, 1) : [], saved: false });

function dropTarget(node, onDrop) {

  node.addEventListener('dragleave', (e) => { if (!node.contains(e.relatedTarget)) node.classList.remove('drop'); });

// ---- actions ----------------------------------------------------------------------------
const placement = (c, confirmed) => ({ project_id: c.id, org_id: c.orgId === SKIP ? null : c.orgId, name: c.languageName, languoid_id: c.languoidId, code: c.code, confirmed: confirmed ?? !!c.confirmed });

/** The language a project comes over with when it is sent now: chosen, decided in the CSV, or a sure suggestion. */
function withLanguage(c) {

function transferOne(c) {

    title: `Transfer ${c.name} into ${orgName(c.orgId)}?`,
    body: [`It becomes the language ${c.code ?? language(c).text}${l.conf ? '' : ''} in ${orgName(c.orgId)}, with ${plural(c.assets, 'recording')}.`, 'After this it stays in this organization and keeps up with v2.'],
    confirm: 'Transfer'

function transferOrg(orgId) {

  const states = new Map(all.map((c) => [c.id, stateOf(c).key]));
  const again = all.filter((c) => ['done', 'issues'].includes(states.get(c.id)));

    title: `Transfer ${plural(fresh.length, 'project')} into ${orgName(orgId)}?`,
    body: [
      `${org?.saved ? '' : `Makes ${orgName(orgId)} in Next. `}Adds ${plural(fresh.length, 'language')} with ${plural(fresh.reduce((n, c) => n + c.assets, 0), 'recording')}.`,
      waiting.length ? `${plural(waiting.length, 'project')} need a language first and wait.` : '',
      'They stay in this organization and keep up with v2.'

async function openDrawer(id, focus) {
  const c = S.cards.find((x) => x.id === id);
  // The search starts from what is most likely the language: the suggestion, else the project's name.
  const query = c ? (c.recommendation.name || c.name).replace(/\b(bible|project|test|nt|ot|el|stories|translation)\b/gi, '').trim() : '';
  S.open = { id, log: null, languages: null, query, results: null, focus };
  renderDrawer();
  $('#drawer').classList.add('open');
  search(query);
  try { Object.assign(S.open, await api('/api/project/' + encodeURIComponent(id))); } catch { S.open.log = []; S.open.languages = []; }
  if (S.open?.id === id) renderDrawer();
}
function closeDrawer() { S.open = null; $('#drawer').classList.remove('open'); }
let searching = null;
function search(q) {
  const open = S.open;
  if (!open) return;
  open.query = q;
  clearTimeout(searching);
  searching = setTimeout(async () => {
    if (q.trim().length < 2) { open.results = []; return renderDrawer(); }
    open.results = null;
    renderResults();
    const list = await api('/api/languoids?q=' + encodeURIComponent(q.trim())).catch(() => []);
    if (S.open === open && open.query === q) { open.results = list; renderResults(); }
  }, 250);
}

    ['Project name', c.name],
    c.description ? ['Description', c.description] : null,
    ['v2 says', v2Languages.length ? v2Languages.map((x) => `${x.name} (${x.type})`).join(' · ') : [r.v2Target && `${r.v2Target} (target)`, r.v2Source && r.v2Source !== '—' && `${r.v2Source} (source)`].filter(Boolean).join(' · ') || '—'],
    r.tagged ? ['Recordings tagged', r.tagged] : null,
    r.name ? ['Suggested', `${r.name} [${r.code}] · ${r.confidence} — ${r.reason}`] : ['Suggested', r.reason || 'nothing']
  ].filter(Boolean);
  $('#drawer').replaceChildren(
    el('button', { class: 'x', onclick: closeDrawer, title: 'Close' }, '✕'),
    el('div', { class: 'drawer-head' },
      el('h2', {}, c.name),
      el('div', { class: 'sub' }, `${orgName(c.orgId)} · ${plural(c.assets, 'recording')} · ${c.private ? 'private' : 'public'} in v2`),
      el('div', { class: `state s-${st.key}${st.live ? ' live' : ''}`, style: `--c: var(--${{ running: 'blue', queued: 'blue', done: 'green', issues: 'red', stopped: 'red', language: 'amber' }[st.key] || 'purple'})` }, el('span', { class: 'dot' }), st.text),
      st.pct != null ? el('div', { class: 'bar live', style: 'width:100%' }, el('i', { style: `width:${st.pct}%` })) : null,
      action ? el('div', { class: 'row' }, el('button', { class: 'small primary', onclick: () => transferOne(c) }, action)) : null),
    el('div', { class: 'drawer-body' },
      issues.length ? [el('h3', {}, 'Issues'), ...issues.map((i) => el('div', { class: `issue ${i.level}` }, i.text, i.list ? el('div', { style: 'margin-top:4px;font-size:12px;opacity:.85' }, i.list.slice(0, 5).map((x) => x.reason).join(' · ')) : null))] : null,
      el('h3', {}, 'Language in Next'),
      el('div', { class: 'block' },
        el('label', { class: 'field' }, el('span', {}, 'Name'),
          el('input', { value: c.languageName ?? '', placeholder: c.name, onchange: (e) => nameLanguage(c, e.target.value) })),
        el('div', { class: 'field' }, el('span', {}, 'Language'),
          el('span', { class: `chip ${l.cls}` }, l.conf ? `${l.text} · suggested, ${l.conf}` : c.code && !c.languoidId ? `${c.code} (no link)` : l.text)),
        el('dl', { class: 'known' }, ...known.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])),
        el('input', { id: 'findLanguage', type: 'search', value: S.open.query ?? '', placeholder: 'Find the language: name, other name, ISO code or glottocode', oninput: (e) => search(e.target.value) }),
        el('div', { id: 'results' })),
      el('h3', {}, `People · ${peopleOf(c).signed} of ${members.length} signed in`),
      ...members.map((m) => {
        const role = roleOf(c, m.id);
        return el('div', { class: 'person' },
          el('span', { class: 'avatar' }, personName(m.id).split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase()),
          el('div', { style: 'flex:1;min-width:0' },
            el('div', {}, personName(m.id), m.owner ? el('span', { class: 'chip', style: 'margin-left:6px' }, 'owner in v2') : null),
            personEmail(m.id) ? el('div', { class: 'email' }, personEmail(m.id)) : null,
            el('div', { class: 'sub' }, `${ROLE_HINT[role](m)} · ${S.signedIn[m.id] ? `signed in ${day(S.signedIn[m.id])}` : 'not signed in yet'}`)),
          el('select', { class: 'role', 'aria-label': `Role for ${personName(m.id)}`, onchange: (e) => setRole(c, m.id, e.target.value) },
            ...ROLES.map(([v, label]) => el('option', { value: v, selected: v === role || null }, label))));
      }),
      el('h3', {}, 'Activity'),
      ...(S.open.log == null ? [el('div', { class: 'empty', style: 'padding:0 18px' }, 'Loading…')]
        : S.open.log.length ? S.open.log.map((x) => el('div', { class: `line ${x.level}` }, el('time', {}, clock(x.at)), el('span', { class: 'who' }, day(x.at)), el('span', { class: 'msg' }, x.message)))
        : [el('div', { class: 'empty', style: 'padding:0 18px' }, 'Not transferred yet.')]))
  );
  renderResults();
  if (S.open.focus === 'language') { S.open.focus = null; $('#findLanguage')?.focus(); }
}

// ---- small pieces -------------------------------------------------------------------------
function ask({ title, body = [], confirm, input }, then) {
  const field = input != null ? el('input', { value: input }) : null;
  const scrim = el('div', { class: 'scrim', onclick: (e) => e.target === scrim && scrim.remove() });
  const ok = () => { scrim.remove(); then(field ? field.value.trim() : undefined); };
  scrim.append(el('div', { class: 'modal', role: 'dialog' }, el('h2', {}, title), ...body.filter(Boolean).map((b) => el('p', {}, b)), field,
    el('div', { class: 'acts' }, el('button', { onclick: () => scrim.remove() }, 'Cancel'), el('button', { class: 'primary', onclick: ok }, confirm))));
  document.body.append(scrim);
  (field ?? scrim.querySelector('.primary')).focus();
  scrim.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') scrim.remove(); });
}

$('#q').addEventListener('input', render);
$('#showOff').addEventListener('change', (e) => { S.showOff = e.target.checked; render(); });
$('#refresh').addEventListener('click', () => { toast('Reading v2 again…'); loadBoard(true); });
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeDrawer());
setInterval(() => { if (S.tab === 'people') loadPeople(); }, 30000);
loadBoard().then(poll);
</script>
</body>
</html>
