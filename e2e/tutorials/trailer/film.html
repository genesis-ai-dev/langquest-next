<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The channel trailer (README.md). Every frame is a pure function of t:
     render.ts loads this page with window.FILM (words, the capture's marks
     and frames, fonts) and calls __seek(t) for each frame it keeps. The
     picture follows the score's timeline: the count (0-5 s), the safe place
     (5-8), rebuilt (8-12), the name (12-15.3), six steps on today's app
     (16-36.3), the count again (36.4-42) and the end card (42-48). -->
<style id="fonts"></style>
<style>
  :root {
    --ink: #1C1440; --accent: #6B48C8; --soft: #8B6FE8; --bg: #F4F2FA;
    --night: #0a0912; --moon: #f4f2fe; --lilac: #a495ff; --red: #ED4243;
    --sans: "Film Sans", "Film Script", sans-serif;
    --mono: "Film Mono", monospace;
    --small: var(--mono);
  }
  html.script { --small: var(--sans); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--night); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; color: var(--moon); }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .a { position: absolute; }
  .w { display: inline-block; white-space: pre; will-change: transform, filter, opacity; }
  .acc { color: var(--lilac); }

  #night { background: radial-gradient(ellipse 60% 70% at 50% 50%, #221b3d 0%, #15112a 45%, #0a0912 80%); }
  #cv { position: absolute; left: 0; top: 0; }
  #gl { position: absolute; left: 0; top: 0; overflow: visible; }
  .count { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; white-space: nowrap;
    text-shadow: 0 0 28px rgba(164,149,255,.55), 0 0 2px rgba(164,149,255,.4); }
  .count .z { opacity: .22; }
  .center { left: 0; width: 1920px; text-align: center; }
  .say { font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; text-wrap: balance; }
  html.script .say, html.script .head, html.script .count { letter-spacing: 0; }
  html.script .say { line-height: 1.3; }
  .lede { font-weight: 500; color: #dcd7f7; letter-spacing: -0.01em; }
  .label { font-family: var(--small); font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--lilac); white-space: nowrap; }
  html.script .label { letter-spacing: 0; text-transform: none; font-weight: 600; }
  #lockup { display: flex; align-items: center; gap: 52px; transform-origin: 0 0; white-space: nowrap; direction: ltr; }
  .mark { font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  #lockup svg, .mini svg { display: block; overflow: visible; }

  #day { background: var(--bg); }
  #day::before { content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle 430px at 360px 880px, rgba(139,111,232,.22), transparent 70%),
      radial-gradient(circle 560px at 1420px 260px, rgba(139,111,232,.12), transparent 70%); }
  #day::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(28,20,64,.07) 1px, transparent 1.6px); background-size: 28px 28px; }
  .ink { position: absolute; inset: 0; color: var(--ink); }
  .ink .acc { color: var(--accent); }
  .paper { color: #fff; }
  .paper .acc { color: #ffd6cf; }
  #flood { background: var(--red); }
  .mini { position: absolute; display: flex; align-items: center; gap: calc(52px * 32 / 165); direction: ltr; white-space: nowrap; }
  .mini .mark { font-size: 32px; }
  .counter { font-family: var(--mono); font-size: 26px; letter-spacing: .12em; color: #8a84a8; white-space: nowrap; }
  .paper .counter, .paper .rl { color: rgba(255,255,255,.75); }
  .head { font-weight: 800; letter-spacing: -0.05em; line-height: .96; text-wrap: balance; }
  html.script .head { line-height: 1.22; }
  .rl { font-family: var(--small); font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: #9a94b8; white-space: nowrap;
    transform: translateX(-50%); }
  html.script .rl { letter-spacing: 0; text-transform: none; font-size: 24px; font-weight: 600; }
  .rl.on { color: var(--accent); font-weight: 700; }
  .paper .rl.on { color: #fff; }
  .cap { font-family: var(--small); font-size: 22px; letter-spacing: .2em; text-transform: uppercase; color: #8a84a8; white-space: nowrap; }
  html.script .cap { letter-spacing: 0; text-transform: none; font-size: 26px; font-weight: 600; }
  .paper .cap { color: rgba(255,255,255,.85); }
  .cap.live { color: var(--accent); }
  .stays { font-size: 26px; font-weight: 500; color: #6e6890; white-space: nowrap; display: flex; align-items: center; gap: 12px; }

  .pane { position: absolute; overflow: hidden; border-radius: 28px; background: #fff;
    box-shadow: 0 40px 90px -20px rgba(28,20,64,.38), 0 8px 22px rgba(28,20,64,.12), 0 0 0 1px rgba(28,20,64,.10); }
  .pane img { position: absolute; left: 0; top: 0; }
  .touch { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%;
    background: rgba(255,255,255,.38); border: 3px solid rgba(107,72,200,.95);
    box-shadow: 0 8px 22px rgba(28,20,64,.28); }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid rgba(107,72,200,.8); }
  #edge { position: absolute; left: 0; width: 1920px; height: 2px; z-index: 3; margin-top: -1px;
    background: linear-gradient(90deg, rgba(196,186,255,0), rgba(222,216,255,.95) 50%, rgba(196,186,255,0));
    box-shadow: 0 0 26px 7px rgba(164,149,255,.42), 0 18px 40px rgba(10,9,18,.35); }
</style>
</head>
<body>
<div id="night" class="layer">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="count" class="a count center"></div>
  <div id="clips" class="a lede center"></div>
  <div id="asof" class="a label center"></div>
  <div id="safe" class="a say center"></div>
  <div id="rebuilt" class="a say center"></div>
  <svg id="gl" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div id="lockup" class="a"></div>
  <div id="forWhom" class="a label center"></div>
  <div id="ocount" class="a count"></div>
  <div id="oclips" class="a lede"></div>
  <div id="oasof" class="a label"></div>
  <div id="olegend" class="a label"></div>
  <div id="tagline" class="a say center"></div>
  <div id="url" class="a label center"></div>
  <div id="contrib" class="a lede center"></div>
</div>
<div id="day" class="layer">
  <div id="inkA" class="ink"></div>
  <svg id="rings" class="layer" width="1920" height="1080"></svg>
  <div id="flood" class="layer"><div id="inkB" class="ink paper"></div></div>
  <div id="panes" class="layer"></div>
  <div id="touches" class="layer"></div>
</div>
<div id="edge"></div>
<script>
'use strict';
const F = window.FILM;
const Wd = F.words;
const LANG = F.lang;
const RTL = LANG === 'ar';
const SCRIPT = !['en', 'es', 'fr', 'pt', 'sw', 'ha', 'id'].includes(LANG);
const SEGMENTED = ['th', 'my', 'zh-Hans'].includes(LANG);
document.documentElement.lang = LANG;
if (SCRIPT) document.documentElement.classList.add('script');
document.getElementById('fonts').textContent = F.fontCss || '';

// ---- time helpers --------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const expo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const cubicIO = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const cubicI = (p) => p * p * p;
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const $ = (id) => document.getElementById(id);
const X = (x, w = 0) => (RTL ? 1920 - x - w : x); // a left edge, mirrored for right-to-left

// ---- words ---------------------------------------------------------------------------------
const nf = new Intl.NumberFormat(LANG);
const nf2 = new Intl.NumberFormat(LANG, { minimumIntegerDigits: 2 });
const ZERO = nf.format(0);
const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
const YEAR = new Intl.NumberFormat(LANG, { useGrouping: false }).format(2026);
const DATE = new Intl.DateTimeFormat(LANG, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }).format(new Date(F.asOf + 'T12:00:00Z'));
const CLIPS = F.clips;

function tokens(text) {
  if (!SEGMENTED) return text.split(/(\s+)/).filter(Boolean);
  const seg = new Intl.Segmenter(LANG === 'zh-Hans' ? 'zh' : LANG, { granularity: 'word' });
  const out = [];
  for (const { segment, isWordLike } of seg.segment(text)) {
    if (/^\s+$/.test(segment)) { out.push(' '); continue; }
    if (!isWordLike && out.length && out[out.length - 1] !== ' ') out[out.length - 1] += segment;
    else out.push(segment);
  }
  return out;
}
/** Fills el with one span per word ("*...*" is the accent) and returns the spans. */
function say(el, text) {
  el.textContent = '';
  const spans = [];
  let accent = false;
  for (const piece of text.split('*')) {
    for (const tok of tokens(piece)) {
      if (/^\s+$/.test(tok)) { el.appendChild(document.createTextNode(' ')); continue; }
      const s = document.createElement('span');
      s.className = 'w' + (accent ? ' acc' : '');
      s.textContent = tok;
      el.appendChild(s);
      spans.push(s);
    }
    accent = !accent;
  }
  el._w = spans;
  return spans;
}
/** Words land: blur 14 to 0 and rise 34 to 0 on expo-out, one after another; and leave before `out`. */
function land(el, t, t0, o = {}) {
  const { stagger = 0.055, dur = 0.8, rise = 34, blur = 14, out = Infinity, outDur = 0.3, fade = 1 } = o;
  const spans = el._w || [el];
  spans.forEach((s, i) => {
    const lt = t - t0 - i * stagger;
    const e = expo(clamp(lt / dur));
    let op = clamp(lt / (dur * 0.35)) * fade;
    let y = rise * (1 - e);
    let b = blur * (1 - e);
    if (t > out - outDur) {
      const q = cubicI(P(t, out - outDur, out));
      op *= 1 - q; y -= 18 * q; b += 9 * q;
    }
    s.style.opacity = op.toFixed(4);
    s.style.transform = `translateY(${y.toFixed(2)}px)`;
    s.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
  });
}
function lineCount(el) { return new Set((el._w || []).map((s) => Math.round(s.offsetTop))).size; }
/** Whether the first of several lines holds a single word ("Every / version kept."); the accent alone on the last
 *  ("Then just / speak.") is how the headlines read. */
function lone(el) {
  const words = el._w || [];
  if (SEGMENTED || words.length < 3) return false;
  const top = Math.round(words[0].offsetTop);
  return Math.round(words[1].offsetTop) !== top;
}
/** The largest size from `size` down at which el keeps to maxLines and no word is wider than maxW, without a word
 *  alone on the first line when 28 px less still allows that. */
function fit(el, size, maxW, maxLines) {
  el.style.width = maxW + 'px';
  const fits = (s) => { el.style.fontSize = s + 'px'; return lineCount(el) <= maxLines && (el._w || []).every((w) => w.offsetWidth <= maxW); };
  let first = 0;
  for (let s = size; s >= 28; s -= 2) {
    if (!fits(s)) continue;
    first ||= s;
    if (!lone(el)) return s;
    // Balanced lines can leave the first word alone ("Every / version kept."); filled ones may not.
    el.style.textWrap = 'wrap';
    if (fits(s) && !lone(el)) return s;
    el.style.textWrap = '';
    if (s <= first - 28) break;
  }
  if (first) { fits(first); return first; }
  el.style.fontSize = '28px';
  return 28;
}
function show(el, on) { el.style.display = on ? '' : 'none'; }

/** A count with its leading zeros dimmed, as seven digits, and the "+" of a round number passed (plus is its opacity). */
function countHtml(v, plus = 0) {
  const s = new Intl.NumberFormat(LANG, { minimumIntegerDigits: 7 }).format(Math.round(v));
  let i = 0;
  const nz = s.search(new RegExp(`[^${ZERO}\\D]`, 'u'));
  i = nz < 0 ? s.length - 1 : nz;
  return `<span class="z">${s.slice(0, i)}</span>${s.slice(i)}<span style="opacity:${plus.toFixed(3)}">+</span>`;
}

// ---- the glyph -----------------------------------------------------------------------------
// apps/mobile/assets/logo.svg, in its 1536x1024 source units; the check cuts a gap through the tallest bar.
const BARS = [{ x: 385, w: 111, y: 465, h: 192 }, { x: 531, w: 111, y: 374, h: 342 }, { x: 677, w: 113, y: 273, h: 487 }];
const CHECK = 'M738 518 L878 652 L1124 415';
const GX = 780.5, GY = 516.5, GW = 792; // centre and width of the glyph (bars to the end of the check)
let maskN = 0;
function glyphSvg(fill, w) {
  const id = 'gap' + maskN++;
  const k = w / GW;
  return `<svg width="${w}" height="${(487 * k).toFixed(2)}" viewBox="385 273 792 487">
    <defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024">
      <rect width="1536" height="1024" fill="white"/><path d="${CHECK}" fill="none" stroke="black" stroke-width="150" stroke-linecap="round" stroke-linejoin="round"/></mask></defs>
    <g fill="${fill}" mask="url(#${id})">${BARS.map((b) => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="${b.w / 2}"/>`).join('')}</g>
    <path d="${CHECK}" fill="none" stroke="${fill}" stroke-width="106" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
$('gl').innerHTML = `<defs><mask id="stageGap" maskUnits="userSpaceOnUse" x="-4000" y="-4000" width="12000" height="12000">
  <rect x="-4000" y="-4000" width="12000" height="12000" fill="white"/>
  <path id="sgap" d="${CHECK}" pathLength="1" fill="none" stroke="black" stroke-width="150" stroke-linecap="round" stroke-linejoin="round"/></mask></defs>
  <g id="gg"><g fill="#f4f2fe" mask="url(#stageGap)">${BARS.map((b, i) => `<rect id="sb${i}" x="${b.x}" width="${b.w}"/>`).join('')}</g>
  <path id="schk" d="${CHECK}" pathLength="1" fill="none" stroke="#f4f2fe" stroke-width="106" stroke-linecap="round" stroke-linejoin="round"/></g>`;
/** Draws the stage glyph centred at (cx, cy), k film px per source unit; grow[i] how far each bar is up, m how far the
 *  bars have moved from standing on a line to the logo, c how much of the check is drawn. */
function stageGlyph(on, cx, cy, k, grow, m, c, base = 760) {
  const g = $('gl');
  show(g, on);
  if (!on) return;
  $('gg').setAttribute('transform', `translate(${cx} ${cy}) scale(${k}) translate(${-GX} ${-GY})`);
  BARS.forEach((b, i) => {
    const h = Math.max(0.001, b.h * grow[i]);
    const y = lerp(base - h, b.y, m);
    const r = $('sb' + i);
    r.setAttribute('y', y); r.setAttribute('height', h); r.setAttribute('rx', Math.min(b.w / 2, h / 2));
  });
  for (const id of ['schk', 'sgap']) {
    $(id).setAttribute('stroke-dasharray', `${c} 2`);
    $(id).style.opacity = c > 0.002 ? 1 : 0;
  }
}

// ---- the capture ---------------------------------------------------------------------------
const C = F.capture;
const VW = C.viewport.width, VH = C.viewport.height;
const MARK = Object.fromEntries(C.marks.map((m) => [m.name, m]));
const mk = (name) => { const m = MARK[name]; if (!m) throw new Error('no mark ' + name); return m; };
const box = (name, part) => { const b = mk(name).boxes[part]; if (!b) throw new Error(`no box ${name}.${part}`); return b; };
const takes = {};
for (const f of C.frames) (takes[f.take] ||= []).push(f);
for (const k in takes) takes[k].sort((a, b) => a.t - b.t);
/** The frame on screen at capture time ct. */
function frameAt(take, ct) {
  const fs = takes[take];
  let lo = 0, hi = fs.length - 1, best = 0;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (fs[mid].t <= ct) { best = mid; lo = mid + 1; } else hi = mid - 1; }
  return F.frameBase + fs[best].file;
}
const at = (name, dt = 0) => ({ take: mk(name).take, ct: mk(name).t + dt });

// ---- the six steps -------------------------------------------------------------------------
const ACTS = [
  { key: 'listen', t0: 16.0, t1: 19.0 },
  { key: 'speak', t0: 19.0, t1: 23.0 },
  { key: 'offline', t0: 23.0, t1: 27.0 },
  { key: 'heard', t0: 27.0, t1: 30.0 },
  { key: 'kept', t0: 30.0, t1: 33.0 },
  { key: 'decides', t0: 33.0, t1: 36.3 },
];
const COL = { cx: 1350, maxW: 800, maxH: 660, cy: 486, gap: 18 };
// Each act's cards come in a little before its beat and go a little after the next one's, so the column is never empty.
const IN = 0.18, OUT = 0.1;
const RAIL_Y = 944;
const railX = (i) => X(190 + i * 308);

/** Lays crops out as a column of panes in the right-hand column: their film rects and scale. */
function column(crops, maxH = COL.maxH) {
  const total = crops.reduce((a, c) => a + c[3], 0);
  const s = Math.min(COL.maxW / VW, (maxH - COL.gap * (crops.length - 1)) / total);
  const H = total * s + COL.gap * (crops.length - 1);
  let y = COL.cy - H / 2;
  const w = VW * s;
  const x = X(COL.cx - w / 2, w) ;
  return { s, rects: crops.map((c) => { const r = { x, y, w, h: c[3] * s, crop: c }; y += r.h + COL.gap; return r; }) };
}
/** Where a point of the phone's screen lands on film, in a rect showing crop at scale s. */
const onFilm = (r, s, px, py) => ({ x: r.x + (px - r.crop[0]) * s, y: r.y + (py - r.crop[1]) * s });
const mid = (b) => [b.x + b.width / 2, b.y + b.height / 2];

let L = {}; // layouts, computed once the fonts are in
function layoutActs() {
  // 1 Listen: the Bible for the passage, from its tabs to the verses.
  const bible = box('listen', 'bible'), divider = box('listen', 'divider');
  L.listen = column([[0, bible.y - 8, VW, divider.y - 6 - (bible.y - 8)]]);
  L.listen.play = mid(box('listen', 'play'));
  L.listen.tap = ACTS[0].t0 + 0.98;
  L.listen.click = mk('listen-playing').t - 0.3;
  // 2 Speak: the record controls open into the live recording panel.
  const rec = box('speak', 'record'), parts = box('speak-recording', 'parts');
  const open = [0, parts.y - 72, VW, VH - (parts.y - 72)];
  L.speak = column([open], 720);
  L.speak.idleTop = rec.y - 22;
  L.speak.mic = mid(rec);
  L.speak.tap = ACTS[1].t0 + 0.48;
  {
    // The red starts from the mic where it was pressed.
    const { s, rects: [full] } = L.speak;
    const idleH = (VH - L.speak.idleTop) * s;
    const p = onFilm({ ...full, y: COL.cy - idleH / 2, crop: [0, L.speak.idleTop] }, s, ...L.speak.mic);
    L.speak.flood = { x: p.x, y: p.y + enter(L.speak.tap, 19.06, 23.0).dy };
  }
  // 3 Offline: the upload bar and the three parts kept on the phone.
  const bar = box('offline', 'bar'), group = box('offline', 'group'), last = box('offline', 'last');
  L.offline = column([[0, 0, VW, bar.y + bar.height + 4], [0, group.y - 18, VW, last.y + last.height + 4 - (group.y - 18)]]);
  // 4 Heard: who checks it next, asked; then the passage with the team asked.
  const first = box('heard', 'first'), lastR = box('heard', 'last'), ask = box('heard', 'ask');
  L.heard = column([[0, first.y - 44, VW, lastR.y + lastR.height + 12 - (first.y - 44)], [0, ask.y - 12, VW, ask.height + 24]]);
  L.heard.ask = mid(ask);
  L.heard.tap = ACTS[3].t0 + 1.0;
  const device = box('heard-asked', 'device'), peer = box('heard-asked', 'peer');
  L.asked = column([[0, device.y - 10, VW, peer.y + peer.height + 12 - (device.y - 10)]]);
  // 5 Kept: a passage that has been through every check, its version, then down to its history.
  const ver = box('kept', 'version'), hist = box('kept', 'history');
  const KEPT_H = 330;
  L.kept = column([[0, 0, VW, KEPT_H]]);
  L.kept.from = Math.max(0, ver.y - 30);
  L.kept.to = Math.min(VH - KEPT_H, Math.max(L.kept.from, hist.y - 30));
  // 6 Decides: who may use the work, the pick moving down the licenses, the list following it.
  const DECIDES_H = 360;
  L.decides = column([[0, 0, VW, DECIDES_H]]);
  L.decides.tops = [0, 1, 2].map((i) => {
    const first = box(`decides-${i}`, 'first'), n = box(`decides-${i}`, 'next');
    return Math.min(VH - DECIDES_H, Math.max(first.y - 6, n.y + n.height + 12 - DECIDES_H));
  });
  L.decides.taps = [0, 1].map((i) => ({ t: ACTS[5].t0 + 1.0 + i * 1.0, at: mid(box(`decides-${i}`, 'next')), from: i }));
}

// ---- the light layer's words, drawn twice: dark ink, and white on the red of recording ----------
function railSvg() {
  return `<svg class="a" style="left:0;top:0" width="1920" height="1080">
    <line class="rbase" x1="${railX(0)}" x2="${railX(5)}" y1="${RAIL_Y}" y2="${RAIL_Y}" stroke-width="3" stroke-linecap="round"/>
    <line class="rfill" x1="${railX(0)}" y1="${RAIL_Y}" y2="${RAIL_Y}" stroke-width="3" stroke-linecap="round"/>
    ${ACTS.map((_, i) => `<circle class="rhalo" data-i="${i}" cx="${railX(i)}" cy="${RAIL_Y}" r="24"/><circle class="rdot" data-i="${i}" cx="${railX(i)}" cy="${RAIL_Y}" r="10" stroke-width="2.5"/>`).join('')}
  </svg>`;
}
const MINI = 32 / 165; // the name in the corner, as a share of its size on the night
function buildInk(root, paper) {
  const fillInk = paper ? '#ffffff' : '#1C1440';
  root.innerHTML = `
    <div class="mini" style="top:0">${glyphSvg(fillInk, 239 * MINI)}<div class="mark">LangQuest <span class="acc">Next</span></div></div>
    <div class="a counter" style="top:62px"></div>
    ${railSvg()}

      const fade = 1 - P(t, s0 + 0.78, s0 + 0.9);
      if (fade <= 0) continue;
      pill(pt.x, pt.y, 9 * lerp(1, 0.7, p), 9 * lerp(1, 0.7, p), `rgba(196,186,255,${0.95 * fade})`);
    }
  }
  // The ground: a line of light the logo's bars rise from (8.3-12.2), and again at the end (42-43.2).
  const horizon = (y, x0, x1, o) => {
    if (o <= 0) return;
    const lg = g.createLinearGradient(x0, 0, x1, 0);
    lg.addColorStop(0, 'rgba(164,149,255,0)'); lg.addColorStop(0.5, `rgba(196,186,255,${0.8 * o})`); lg.addColorStop(1, 'rgba(164,149,255,0)');
    g.fillStyle = lg; g.fillRect(x0, y - 1, x1 - x0, 2);
    const glow = g.createRadialGradient(960, y, 0, 960, y, 520);
    glow.addColorStop(0, `rgba(120,96,230,${0.22 * o})`); glow.addColorStop(1, 'rgba(120,96,230,0)');
    g.save(); g.translate(960, y); g.scale(1, 0.3); g.translate(-960, -y);
    g.fillStyle = glow; g.fillRect(400, y - 520, 1120, 1040); g.restore();
  };
  if (t > 8.3 && t < 12.3) {
    const draw = expo(P(t, 8.3, 9.3));
    const half = 640 * draw;
    horizon(HORIZON, 960 - half, 960 + half, 1 - P(t, 11.7, 12.2));
  }
  if (t > 41.95 && t < 43.3) {
    const draw = expo(P(t, 42.0, 42.6));
    horizon(560, 960 - 520 * draw, 960 + 520 * draw, 1 - P(t, 42.85, 43.25));
  }
  // The count again: one square for every thousand clips.
  if (t > 36.3 && t < 42.1) {
    const v = CLIPS * Math.pow(P(t, 36.5, 39.65), 1.25);
    const n = Math.floor(v / 1000);
    const o = expo(P(t, 36.35, 36.9)) * (1 - P(t, 41.55, 41.95));
    const sweep = lerp(-0.3, 1.3, cubicIO(P(t, 40.0, 41.0)));
    for (let c = 0; c < GRID.cols; c++) for (let r = 0; r < GRID.rows; r++) {
      const rank = GRID_RANK[c + ',' + r];
      const x = GRID_X0 + c * GRID.pitch, y = GRID.y0 + (GRID.rows - 1 - r) * GRID.pitch;
      const u = (c / (GRID.cols - 1)) * 0.7 + (r / (GRID.rows - 1)) * 0.3;
      const shine = t > 40.0 && t < 41.05 ? Math.exp(-Math.pow((u - sweep) / 0.07, 2)) : 0;
      if (rank < n) {
        const fresh = clamp(1 - (n - rank) / 40);
        const R = Math.round(lerp(lerp(139, 214, fresh), 255, shine * 0.85));
        const G = Math.round(lerp(lerp(111, 204, fresh), 255, shine * 0.85));
        g.fillStyle = `rgba(${R},${G},255,${o})`;
      } else g.fillStyle = `rgba(164,149,255,${0.1 * o})`;
      g.beginPath(); g.roundRect(x, y, GRID.size, GRID.size, 2.5); g.fill();
    }
  }
}

let LOCK = null; // the name's place: the glyph's centre and size, and the whole lockup's box
function layoutNight() {
  const count = $('count');
  count.innerHTML = countHtml(CLIPS, 1);
  count.style.fontSize = '296px';
  count.style.fontSize = Math.min(296, (296 * 1560) / Math.max(1, measure(count))) + 'px';
  count.style.top = 408 - count.offsetHeight / 2 + 'px';
  $('clips').textContent = fill(Wd.clips, { year: YEAR }).replace(/\*/g, '');
  say($('clips'), $('clips').textContent);
  $('clips').style.fontSize = SCRIPT ? '36px' : '40px';
  $('clips').style.top = 767 - $('clips').offsetHeight / 2 + 'px';
  say($('asof'), fill(Wd.asOf, { date: DATE }));
  $('asof').style.fontSize = SCRIPT ? '28px' : '26px';
  $('asof').style.top = 826 - $('asof').offsetHeight / 2 + 'px';
  for (const [id, key, y] of [['safe', 'safe', 258], ['rebuilt', 'rebuilt', 290]]) {
    const el = $(id);
    say(el, Wd[key]);
    el.style.left = '160px';
    fit(el, SCRIPT ? 84 : 92, 1600, key === 'safe' ? 1 : 2);
    el.style.width = '1600px';
    el.style.top = y - el.offsetHeight / 2 + 'px';
    el.dir = RTL ? 'rtl' : 'ltr';
  }
  // The name, centred: the glyph and LangQuest Next.
  const lock = $('lockup');
  lock.innerHTML = `${glyphSvg('#f4f2fe', 239)}<div class="mark">LangQuest <span class="acc">Next</span></div>`;
  lock.querySelector('.mark').style.fontSize = '165px';
  lock.querySelector('.mark').style.color = '#f4f2fe';
  const w = lock.offsetWidth, h = lock.offsetHeight;
  lock.style.left = 960 - w / 2 + 'px';
  lock.style.top = 540 - h / 2 + 'px';
  const gr = lock.querySelector('svg').getBoundingClientRect(), lr = lock.getBoundingClientRect();
  LOCK = { x: 960 - w / 2, y: 540 - h / 2, w, h, k: 239 / GW };
  LOCK.gx = LOCK.x + (gr.left - lr.left) + gr.width / 2;
  LOCK.gy = LOCK.y + (gr.top - lr.top) + gr.height / 2;
  say($('forWhom'), Wd.forWhom);
  $('forWhom').style.fontSize = SCRIPT ? '28px' : '22px';
  $('forWhom').style.top = 693 - $('forWhom').offsetHeight / 2 + 'px';
  // The count again, in the left column, the grid on the right.
  const oc = $('ocount');
  oc.innerHTML = countHtml(CLIPS, 1);
  oc.style.fontSize = '190px';
  oc.style.fontSize = Math.min(190, (190 * 860) / Math.max(1, measure(oc))) + 'px';
  oc.style.left = X(140, oc.offsetWidth) + 'px';
  oc.style.top = 368 - oc.offsetHeight / 2 + 'px';
  const ol = $('oclips');
  say(ol, fill(Wd.clips, { year: YEAR }));
  ol.style.fontSize = SCRIPT ? '36px' : '40px';
  ol.style.lineHeight = SCRIPT ? '1.45' : '1.2';
  ol.style.width = '760px';
  ol.style.textWrap = 'balance';
  ol.style.left = X(140, 760) + 'px';
  ol.style.textAlign = RTL ? 'right' : 'left';
  ol.dir = RTL ? 'rtl' : 'ltr';
  ol.style.top = '510px';
  const oa = $('oasof');
  say(oa, fill(Wd.asOf, { date: DATE }));
  oa.style.fontSize = SCRIPT ? '26px' : '22px';
  oa.style.left = X(140, oa.offsetWidth) + 'px';
  oa.style.top = 510 + ol.offsetHeight + 34 + 'px';
  const leg = $('olegend');
  leg.innerHTML = `<span style="display:inline-block;width:16px;height:16px;border-radius:3px;background:#8B6FE8;vertical-align:-1px;margin-${RTL ? 'left' : 'right'}:12px"></span><span>${fill(Wd.square, { one: nf.format(1), n: nf.format(1000) })}</span>`;
  leg.style.fontSize = SCRIPT ? '26px' : '22px';
  leg.style.color = 'var(--lilac)';
  leg.dir = RTL ? 'rtl' : 'ltr';
  leg.style.left = X(140, leg.offsetWidth) + 'px';
  leg.style.top = oa.offsetTop + oa.offsetHeight + 22 + 'px';
  leg._w = [leg];
  // The end card.
  const tg = $('tagline');
  say(tg, Wd.tagline);
  tg.style.left = '160px';
  fit(tg, SCRIPT ? 54 : 58, 1600, 1);
  tg.style.width = '1600px';
  tg.style.top = 678 - tg.offsetHeight / 2 + 'px';
  tg.dir = RTL ? 'rtl' : 'ltr';
  $('url').textContent = 'langquest.org';
  $('url').style.fontSize = '30px';
  $('url').style.fontFamily = 'var(--mono)';
  $('url').style.letterSpacing = '.08em';
  $('url').style.textTransform = 'none';
  $('url').style.top = 777 - $('url').offsetHeight / 2 + 'px';
  $('url')._w = [$('url')];
  say($('contrib'), Wd.contribution);
  $('contrib').style.fontSize = SCRIPT ? '26px' : '24px';
  $('contrib').style.color = '#8f86c8';
  $('contrib').style.top = 975 - $('contrib').offsetHeight / 2 + 'px';
  for (const el of [$('count'), $('ocount')]) el._w = [el];
}
function measure(el) { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; }

function seekNight(t) {
  drawNight(t);
  // The count (0-4.9).
  const count = $('count');
  show(count, t < 5.0);
  if (t < 5.0) {
    count.innerHTML = countHtml(CLIPS * Math.pow(P(t, 0.15, 1.95), 1.6), expo(P(t, 1.95, 2.3)));
    count._w = [count];
    land(count, t, 0.0, { dur: 0.5, out: 4.95, outDur: 0.45, blur: 8, rise: 10 });
  }
  show($('clips'), t > 0.9 && t < 5.0); land($('clips'), t, 1.0, { out: 4.95, outDur: 0.4, stagger: 0.04 });
  show($('asof'), t > 1.4 && t < 5.0); land($('asof'), t, 1.5, { out: 4.95, outDur: 0.4, stagger: 0.04 });
  show($('safe'), t > 4.95 && t < 8.05); land($('safe'), t, 5.0, { out: 8.0, outDur: 0.35 });
  show($('rebuilt'), t > 7.95 && t < 12.0); land($('rebuilt'), t, 8.05, { out: 11.95, outDur: 0.4 });
  // The bars rise from the ground, gather into the glyph and its check (9.98-12.4), and it takes its place in the name.
  const lock = $('lockup');
  const mark = lock.querySelector('.mark');
  const lockSvg = lock.querySelector('svg');
  let stage = false;
  if (t > 9.9 && t < 13.1) {
    const grow = [9.98, 10.48, 10.98].map((b) => expo(P(t, b, b + 0.42)));
    const m = cubicIO(P(t, 11.75, 12.3));
    const c = cubicIO(P(t, 12.0, 12.42));
    const toCentre = cubicIO(P(t, 11.75, 12.3));
    const toName = cubicIO(P(t, 12.5, 13.05));
    const k0 = 0.477;
    const cx = lerp(960, LOCK.gx, toName);
    const cy = lerp(lerp(HORIZON - (760 - GY) * k0, 540, toCentre), LOCK.gy, toName);
    const k = lerp(k0, LOCK.k, toName);
    stageGlyph(true, cx, cy, k, grow, m, c);
    stage = true;
  }
  // The end: bars on a line, then the name, its line, the address and who made it.
  if (t > 41.95 && t < 43.25) {
    const grow = [42.1, 42.3, 42.5].map((b) => expo(P(t, b, b + 0.35)));
    const m = cubicIO(P(t, 42.75, 43.1));
    const c = cubicIO(P(t, 42.85, 43.2));
    const lift = cubicIO(P(t, 42.75, 43.2));
    const k0 = 0.2;
    const k = lerp(k0, LOCK.k, lift);
    const cx = lerp(960, LOCK.gx, lift);
    const cy = lerp(560 - (760 - GY) * k0, LOCK.gy - 108, lift);
    stageGlyph(true, cx, cy, k, grow, m, c);
    stage = true;
  }
  if (!stage) stageGlyph(false);
  const nameOn = (t >= 13.05 && t < 15.7) || t >= 43.2;
  const wordOn = (t >= 12.55 && t < 15.7) || t >= 42.95;
  show(lock, wordOn);
  if (wordOn) {
    lockSvg.style.opacity = nameOn ? 1 : 0;
    // The name comes in behind the glyph as it moves over.
    const t0 = t < 20 ? 12.78 : 43.0;
    const e = expo(P(t, t0, t0 + 0.75));
    mark.style.opacity = clamp((t - t0) / 0.3).toFixed(3);
    mark.style.filter = e < 0.995 ? `blur(${(16 * (1 - e)).toFixed(2)}px)` : 'none';
    mark.style.transform = `translateX(${(60 * (1 - e)).toFixed(2)}px)`;
    // To the corner as the day comes up (15.0-15.55).
    let tf = '';
    if (t < 20) {
      const f = cubicIO(P(t, 15.0, 15.55));
      const sigma = lerp(1, MINI, f);
      const mini = { x: RTL ? 1920 - 76 - LOCK.w * MINI : 76, y: 73 - (LOCK.h * MINI) / 2 };
      const dx = lerp(0, mini.x - LOCK.x, f), dy = lerp(0, mini.y - LOCK.y, f);
      tf = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) scale(${sigma.toFixed(4)})`;
    } else tf = 'translateY(-108px)';
    lock.style.transform = tf;
  }
  show($('forWhom'), t > 13.2 && t < 15.2); land($('forWhom'), t, 13.35, { out: 15.05, outDur: 0.3, stagger: 0.03 });
  // The count again (36.4-42).
  const oc = $('ocount');
  show(oc, t > 36.3 && t < 42.0);
  if (t > 36.3 && t < 42.0) {
    oc.innerHTML = countHtml(CLIPS * Math.pow(P(t, 36.5, 39.65), 1.25), expo(P(t, 39.65, 40.0)));
    land(oc, t, 36.4, { dur: 0.6, out: 41.95, outDur: 0.4, blur: 10, rise: 18 });
  }
  for (const [id, t0] of [['oclips', 36.7], ['oasof', 37.0], ['olegend', 37.3]]) {
    show($(id), t > t0 - 0.05 && t < 42.0);
    land($(id), t, t0, { out: 41.95, outDur: 0.4, stagger: 0.035 });
  }
  show($('tagline'), t > 43.5); land($('tagline'), t, 43.6);
  show($('url'), t > 44.0); land($('url'), t, 44.1, { rise: 18 });
  show($('contrib'), t > 44.4); land($('contrib'), t, 44.5, { rise: 14, stagger: 0.03 });
}

// ---- the whole --------------------------------------------------------------------------------
function seek(t) {
  pending.length = 0;
  const night = $('night'), day = $('day');
  const dayOn = t >= 15.2 && t < 36.4;
  show(day, dayOn);
  // The day comes up from the bottom (15.2-15.65), and the night comes back down over it (36.0-36.4), a line of light
  // at the edge.
  const up = cubicIO(P(t, 15.2, 15.65)), down = cubicIO(P(t, 36.0, 36.4));
  if (dayOn) {
    day.style.clipPath = up < 1 ? `inset(${((1 - up) * 100).toFixed(3)}% 0 0 0)` : 'none';
    day.style.filter = down > 0 ? `blur(${(8 * down).toFixed(2)}px)` : 'none';
    seekDay(t);
  }
  const nightOn = t < 15.66 || t >= 36.0;
  show(night, nightOn);
  night.style.zIndex = t >= 36.0 ? 2 : 0;
  day.style.zIndex = 1;
  night.style.clipPath = t >= 36.0 && down < 1 ? `inset(0 0 ${((1 - down) * 100).toFixed(3)}% 0)` : 'none';
  if (nightOn) seekNight(t);
  const edge = $('edge');
  const wiping = (t > 15.2 && up < 1) || (t > 36.0 && down < 1);
  show(edge, wiping);
  if (wiping) edge.style.top = (t < 20 ? (1 - up) * 1080 : down * 1080).toFixed(2) + 'px';
}

window.__ready = (async () => {
  await document.fonts.ready;
  layoutActs();
  buildInk($('inkA'), false);
  buildInk($('inkB'), true);
  layoutInk($('inkA'));
  layoutInk($('inkB'));
  layoutNight();
  return true;
})();
window.__seek = async (t) => {
  await window.__ready;
  seek(t);
  await Promise.all(pending);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
};
