# Every hour: when no review is open, send the newest iPhone build that
# Apple has processed in TestFlight to App Review
# (scripts/app-store-review.mjs, decisions.md 157). A merge into main that
# makes a new iPhone build runs the same step right after its TestFlight
# upload (deploy-to-testers.yml), but Apple is usually still processing
# that build then, so this schedule is what sends it, within the hour after
# Apple is done, and the builds that waited while a review was open. It never
# cancels or changes a review; after a rejection a newer build takes the
# rejected one's place, and the rejected build itself waits for a person.
# It reads the App Store Connect key APP_STORE_REVIEW_KEY from
# EAS's production environment (docs/environments.md, "The App Store key").
name: Send the newest iPhone build to App Review

on:
  schedule:
    - cron: '7 * * * *'

defaults:
  tools:
    node: '24'

jobs:
  review_ios:
    name: Send to App Review when no review is open
    environment: production
    steps:
      - uses: eas/checkout
      - name: Send the newest build to App Review, or let it wait in TestFlight
        run: |
          cd ../..
          node scripts/app-store-review.mjs
