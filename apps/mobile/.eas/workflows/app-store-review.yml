# Every hour: send the newest iPhone build that Apple has processed in
# TestFlight to App Review, in place of a review of an older build
# (scripts/app-store-review.mjs, decisions.md 157 and 253), and the newest
# Android build left in Play's internal testing to production review
# (scripts/play-review.mjs). A merge into main that makes a new build runs
# the iPhone step right after its upload (deploy-to-testers.yml), but Apple
# is usually still processing the build then, so this schedule is what
# sends it, within the hour after Apple is done. New Android builds go
# straight to production review; the Android step sends a build that was
# left in internal testing (from before 2026-11-16, or put there by hand),
# so that nothing stays there. After a rejection a newer iPhone build takes
# the rejected one's place, and the rejected build itself waits for a
# person. It reads the App Store Connect key APP_STORE_REVIEW_KEY and the
# Google Play key PLAY_REVIEW_KEY from EAS's production environment
# (docs/environments.md, "The App Store key" and "The Play key").
name: Send the newest builds to store review

on:
  schedule:
    - cron: '7 * * * *'

defaults:
  tools:
    node: '24.22.3'

jobs:
  review_ios:
    name: Send to App Review, in place of a review of an older build
    environment: production
    steps:
      - uses: eas/checkout
      - name: Send the newest build to App Review once Apple has processed it
        run: |
          cd ../..
          node scripts/app-store-review.mjs
  review_android:
    name: Send the newest build left in internal testing to production review
    environment: production
    steps:
      - uses: eas/checkout
      - name: Send the newest build in internal testing to production review
        run: |
          cd ../..
          node scripts/play-review.mjs
