# Every merge to main reaches people on both platforms (runs on Expo's
# servers, not GitHub Actions). Each platform is decided on its own: if the
# native fingerprint matches an existing production build, the change ships
# as an over-the-air update on the production channel, which installed builds
# take on next launch. Otherwise it builds a new binary and sends it to
# production review when no review is open there (decisions.md 157, amended
# 2026-11-04): on Android to Play's internal testing track (eas.json,
# submit.internal), and then to production with a full rollout when nothing
# is in review on Play (scripts/play-review.mjs); on iOS to TestFlight, and
# then to App Review when no review is open (scripts/app-store-review.mjs;
# after a rejection the build takes the rejected one's place).
# app-store-review.yml runs both steps every hour, so a build that waited
# goes once the review ends. A pull request labelled `store: replace review`
# (scripts/store-choice.mjs) skips the wait on both stores: its Android
# build goes straight to production (eas.json, submit.production), and its
# iPhone build cancels the review that is open and takes its place. Each
# build is public as soon as Google or Apple approves it.
# Each platform's last job tells Linear its lane is out (scripts/linear-sync.mjs,
# decisions.md 53); LINEAR_API_KEY is an EAS variable on `production`. A failed
# job reports nothing: the deploy watchdog routine finds the issue left in
# Deploying.
# The typecheck and unit tests (the same as the pre-push hook) run first.
# This workflow is the only way to make a store build (decisions.md 156),
# and a carried build, apart from the store build's jobs (the carried_* jobs
# below, docs/nearby-sync-plan.md 14.4).
name: Deploy to testers

on:
  push:
    branches: ['main']
    # Only changes that can reach the app: its code, the packages it builds
    # from, and dependencies. Docs and this workflow alone ship nothing.
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '!apps/mobile/.eas/**'
      # Web-only pages the Worker serves (privacy, languages, talks): never in a phone build.
      - '!apps/mobile/public/**'
      - '!**/*.md'

# Node 24 (.node-version, held by scripts/toolchain.test.ts), as on developer
# machines and in GitHub CI: its npm 11 wrote the lockfile, and the image's
# default npm stops at `npm ci` with "Missing: typescript@5.9.3 from lock
# file". Builds take theirs from eas.json.
defaults:
  tools:
    node: '24.22.3'

jobs:
  checks:
    name: Typecheck and tests
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck and tests
        run: |
          cd ../..
          npm run --silent typecheck
          npx vitest run --reporter=dot
  fingerprint:
    name: Fingerprint
    needs: [checks]
    type: fingerprint
    environment: production

  # Whether the merged pull request asks to replace the build in store
  # review (the label `store: replace review`); "false", the default, when
  # it does not or the label cannot be read.
  store_choice:
    name: Wait for an open store review, or replace it
    needs: [fingerprint]
    outputs:
      replace: ${{ steps.choice.outputs.replace }}
    steps:
      - uses: eas/checkout
      - id: choice
        name: Read the merged pull request's labels
        run: |
          cd ../..
          set-output replace "$(node scripts/store-choice.mjs --sha '${{ github.event.head_commit.id }}')"

  get_ios_build:
    name: Check for an existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    # The build's hook (scripts/store-build-guard.mjs) refuses a production
    # build without this ref: store builds come only from main. The store
    # version is the merge time (app.config.js): every build that goes to
    # review needs a higher version number than the last.
    env:
      LQ_STORE_BUILD_REF: ${{ github.ref }}
      LQ_STORE_VERSION_TIME: ${{ github.event.head_commit.timestamp }}
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    # EAS's credentials step says only "failed to resolve submission config"
    # without this (build 44, 2026-10-23, during Expo's iOS maintenance).
    env:
      EXPO_DEBUG: '1'
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
  review_ios:
    name: Send to App Review when no review is open
    needs: [submit_ios]
    environment: production
    steps:
      - uses: eas/checkout
      - name: Send the newest build to App Review, or let it wait in TestFlight
        run: |
          cd ../..
          node scripts/app-store-review.mjs
  publish_ios_update:
    name: Publish iOS over-the-air update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios

  get_android_build:
    name: Check for an existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production
  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    # The build's hook (scripts/store-build-guard.mjs) refuses a production
    # build without this ref: store builds come only from main. The store
    # version is the merge time (app.config.js): every build that goes to
    # review needs a higher version number than the last.
    env:
      LQ_STORE_BUILD_REF: ${{ github.ref }}
      LQ_STORE_VERSION_TIME: ${{ github.event.head_commit.timestamp }}
    params:
      platform: android
      profile: production
  submit_android:
    name: Submit to Play production review, replacing any in review
    needs: [build_android, store_choice]
    if: ${{ needs.store_choice.outputs.replace == 'true' }}
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
  submit_android_internal:
    name: Submit to Play internal testing
    needs: [build_android, store_choice]
    if: ${{ needs.store_choice.outputs.replace != 'true' }}
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: internal
  review_android:
    name: Send to Play production review when nothing is in review
    needs: [submit_android_internal]
    environment: production
    steps:
      - uses: eas/checkout
      - name: Send the newest build to production review, or let it wait in internal testing
        run: |
          cd ../..
          node scripts/play-review.mjs
  publish_android_update:
    name: Publish Android over-the-air update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: android

  # The carried build (docs/nearby-sync-plan.md 14.4, scripts/carried-build.mjs):
  # an APK holding this merge's JavaScript, for a teammate to carry to a phone
  # with no internet or no Play Store. One is due when the APK bucket has no
  # file named for this checkout's reducer, lines and protocol versions and the
  # Android fingerprint, so a merge that changes none of them makes none, and a
  # publish that failed is tried again by the next merge. These jobs need only
  # the fingerprint, and no store job needs them, so their failure never holds
  # up publish_android_update or a store upload. Each step fails closed: a check
  # that cannot tell, or an answer from Google or the bucket that is not what
  # the script expects, stops the job with a plain message and writes nothing.
  # get_android_build matches profile production, so a carried build (profile
  # carried) never stands in for a store build that failed. It goes to Play's alpha track as a draft (eas.json, submit.carried),
  # which scripts/play-review.mjs never reads, so it is never sent to review.
  # It reads PLAY_REVIEW_KEY (GET requests only) and the APK bucket's limited
  # R2 token, APK_R2_ACCESS_KEY_ID and APK_R2_SECRET_ACCESS_KEY, from EAS's
  # production environment (docs/environments.md, "The carried build").
  carried_check:
    name: Check whether a carried build is due
    needs: [fingerprint]
    environment: production
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: check
        name: Ask the APK bucket for this build's file by name
        run: |
          cd ../..
          due="$(npx tsx scripts/carried-build.mjs --check --fingerprint '${{ needs.fingerprint.outputs.android_fingerprint_hash }}')" || exit 1
          set-output due "$due"
  build_carried:
    name: Build the carried build
    needs: [carried_check]
    if: ${{ needs.carried_check.outputs.due == 'true' }}
    type: build
    # Held by the same guard as a store build (scripts/store-build-guard.mjs),
    # and versioned from the merge time like one; it uses up a version code,
    # so later store builds simply number higher.
    env:
      LQ_STORE_BUILD_REF: ${{ github.ref }}
      LQ_STORE_VERSION_TIME: ${{ github.event.head_commit.timestamp }}
    params:
      platform: android
      profile: carried
  submit_carried:
    name: Upload the carried build to Play's alpha track as a draft
    needs: [build_carried]
    type: submit
    params:
      build_id: ${{ needs.build_carried.outputs.build_id }}
      profile: carried
  publish_carried:
    name: Put the carried build's signed universal APK in the APK bucket
    needs: [fingerprint, build_carried, submit_carried]
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Fetch the Play-signed universal APK and put it in the APK bucket under its name
        run: |
          cd ../..
          npx tsx scripts/carried-build.mjs --publish --version-code '${{ needs.build_carried.outputs.app_build_version }}' --fingerprint '${{ needs.fingerprint.outputs.android_fingerprint_hash }}' --build-fingerprint '${{ needs.build_carried.outputs.fingerprint_hash }}'

  linear_ios_update:
    name: Tell Linear (ios update)
    needs: [publish_ios_update]
    environment: production
    steps:
      - uses: eas/checkout
      - name: Report the ios lane
        run: |
          cd ../..
          node scripts/linear-sync.mjs lane --name ios --status ok --sha "$(git rev-parse HEAD)"

  linear_ios_submit:
    name: Tell Linear (ios submit)
    needs: [submit_ios]
    environment: production
    steps:
      - uses: eas/checkout
      - name: Report the ios lane
        run: |
          cd ../..
          node scripts/linear-sync.mjs lane --name ios --status ok --sha "$(git rev-parse HEAD)"

  linear_android_update:
    name: Tell Linear (android update)
    needs: [publish_android_update]
    environment: production
    steps:
      - uses: eas/checkout
      - name: Report the android lane
        run: |
          cd ../..
          node scripts/linear-sync.mjs lane --name android --status ok --sha "$(git rev-parse HEAD)"

  linear_android_submit:
    name: Tell Linear (android submit)
    needs: [submit_android]
    environment: production
    steps:
      - uses: eas/checkout
      - name: Report the android lane
        run: |
          cd ../..
          node scripts/linear-sync.mjs lane --name android --status ok --sha "$(git rev-parse HEAD)"

  linear_android_internal:
    name: Tell Linear (android internal testing)
    needs: [submit_android_internal]
    environment: production
    steps:
      - uses: eas/checkout
      - name: Report the android lane
        run: |
          cd ../..
          node scripts/linear-sync.mjs lane --name android --status ok --sha "$(git rev-parse HEAD)"
