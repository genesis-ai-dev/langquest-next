# Every merge to main reaches testers on both platforms: TestFlight on iOS,
# Google Play's internal testing track on Android (runs on Expo's servers,
# not GitHub Actions). Each platform is decided on its own: if the native
# fingerprint matches an existing production build, the change ships as an
# over-the-air update on the production channel, which installed builds take
# on next launch. Otherwise it builds a new binary and submits it (the track
# is in eas.json, submit.production).
# The typecheck and unit tests (the same as the pre-push hook) run first.
name: Deploy to testers

on:
  push:
    branches: ['main']
    # Only changes that can reach the app: its code, the packages it builds
    # from, and dependencies. Docs and this workflow alone ship nothing.
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '!apps/mobile/.eas/**'
      - '!**/*.md'

jobs:
  checks:
    name: Typecheck and tests
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck and tests
        run: |
          cd ../..
          npm run --silent typecheck
          npx vitest run --reporter=dot
  fingerprint:
    name: Fingerprint
    needs: [checks]
    type: fingerprint
    environment: production

  get_ios_build:
    name: Check for an existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
  publish_ios_update:
    name: Publish iOS over-the-air update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios

  get_android_build:
    name: Check for an existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production
  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production
  submit_android:
    name: Submit to Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
  publish_android_update:
    name: Publish Android over-the-air update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: android
