# SYNC-016 Keep a passage offline, and stop keeping it (docs/ui-test-suite/12-sync-and-offline.md,
# decision 61). REV keeps P-ASIDE, which REV was never asked about and never
# worked on (P-DONE, in the written test, is one REV reviewed in the fixture,
# so it is kept already). The offline card is under "Something else?" on the
# record. Me's count goes up by one, then back down.
appId: com.frontierrnd.langquestnext
name: "SYNC-016 Keep a passage offline, and stop keeping it"
tags:
  - sync
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${REV_EMAIL}
      PASSWORD: ${REV_PASSWORD}
- runFlow: ../common/welcome-skip.yaml
- extendedWaitUntil:
    visible:
      id: "tab-me"
    timeout: 60000
# Me's count once every kept passage is here.
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible: ".*\\d+ passages? on this device.*"
    timeout: 300000
- copyTextFrom: ".*\\d+ passages? on this device.*"
- evalScript: ${output.kept = parseInt(maestro.copiedText.match(/(\d+) passages?/)[1], 10)}
# Step 1: P-ASIDE is not kept.
- tapOn:
    id: "tab-map"
- tapOn: "Find.*"
- inputText: ${P_ASIDE.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_ASIDE}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
- assertVisible: ".*Not kept on this device.*"
- tapOn: "Something else\\?"
- assertVisible: ".*Its text is here, but its audio( and study pictures)? needs? a connection\\. Keep it offline to take it with you\\..*"
# Step 2: keep it.
- tapOn:
    text: "Keep offline"
    waitToSettleTimeoutMs: 0
# One assertion on the toast itself: it is gone a few seconds after the tap.
- assertVisible:
    id: "toast"
    text: ".*Kept on this device\\. It downloads while you are connected\\..*"
- assertVisible: ".*(Downloading for offline|On this device).*"
- assertVisible: ".*Kept because you chose to keep it\\..*"
# Step 3: it finishes, and Me counts one more.
- extendedWaitUntil:
    visible: ".*On this device.*"
    timeout: 300000
- tapOn:
    id: "header-close"
- tapOn:
    id: "header-back"
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible: ".*\\d+ passages? on this device.*"
    timeout: 60000
- copyTextFrom: ".*\\d+ passages? on this device.*"
- assertTrue: ${parseInt(maestro.copiedText.match(/(\d+) passages?/)[1], 10) === output.kept + 1}
# Step 4: stop keeping it; Me's count goes back down.
- tapOn:
    id: "tab-map"
- tapOn: "Find.*"
- inputText: ${P_ASIDE.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_ASIDE}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
- tapOn: "Something else\\?"
- tapOn:
    text: "Stop keeping offline"
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: "toast"
    text: ".*No longer kept\\. Its audio may be removed to make room\\..*"
- tapOn:
    id: "header-close"
- tapOn:
    id: "header-back"
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible: ".*\\d+ passages? on this device.*"
    timeout: 60000
- copyTextFrom: ".*\\d+ passages? on this device.*"
- assertTrue: ${parseInt(maestro.copiedText.match(/(\d+) passages?/)[1], 10) === output.kept}
# A passage kept because REV was asked to review it cannot be let go.
- tapOn:
    id: "tab-map"
- tapOn: "Find.*"
- inputText: ${P_SUBMITTED.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_SUBMITTED}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
- tapOn: "Something else\\?"
- assertVisible: ".*Kept because you were asked to work on it\\..*"
- assertNotVisible: ".*Stop keeping offline.*"
