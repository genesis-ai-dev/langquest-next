# SYNC-016 Keep a passage offline, and stop keeping it (docs/ui-test-suite/12-sync-and-offline.md,
# decisions 61 and 166). REV keeps P-ASIDE, which REV was never asked about and never
# worked on (P-DONE, in the written test, is one REV reviewed in the fixture,
# so it is kept already). The download button is the line at the top of the
# record. Me's count goes up by one, then back down.
appId: com.frontierrnd.langquestnext
name: "SYNC-016 Keep a passage offline, and stop keeping it"
tags:
  - sync
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${REV_EMAIL}
      PASSWORD: ${REV_PASSWORD}
- runFlow: ../common/welcome-skip.yaml
- extendedWaitUntil:
    visible:
      id: "tab-me"
    timeout: 60000
# Me's count once every kept passage is here.
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible: ".*\\d+ passages? on this device.*"
    timeout: 300000
- copyTextFrom: ".*\\d+ passages? on this device.*"
- evalScript: ${output.kept = parseInt(maestro.copiedText.match(/(\d+) passages?/)[1], 10)}
# Step 1: P-ASIDE is not kept.
- tapOn:
    id: "tab-map"
- tapOn: "Find.*"
- inputText: ${P_ASIDE.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_ASIDE}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
# Its download button is the line at the top of the passage (decision 166).
- assertVisible:
    id: "passage-offline"
    text: "Download for offline"
# Step 2: keep it.
- tapOn:
    id: "passage-offline"
    waitToSettleTimeoutMs: 0
# No toast: the line itself says what happens, as it happens (decision 166).
- assertVisible: ".*(Checking this device…|Downloading for offline|Only \\d+ of \\d+ files on this device|On this device).*"
# Step 3: it finishes, and Me counts one more.
- extendedWaitUntil:
    visible: ".*On this device.*"
    timeout: 300000
- tapOn:
    id: "header-back"
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible: ".*\\d+ passages? on this device.*"
    timeout: 60000
- copyTextFrom: ".*\\d+ passages? on this device.*"
- assertTrue: ${parseInt(maestro.copiedText.match(/(\d+) passages?/)[1], 10) === output.kept + 1}
# Step 4: stop keeping it; Me's count goes back down.
- tapOn:
    id: "tab-map"
- tapOn: "Find.*"
- inputText: ${P_ASIDE.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_ASIDE}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
# The green button again: kept by choice, so it stops keeping it.
- tapOn:
    id: "passage-offline"
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: "toast"
    text: ".*No longer kept\\. Its audio may be removed to make room\\..*"
- tapOn:
    id: "header-back"
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible: ".*\\d+ passages? on this device.*"
    timeout: 60000
- copyTextFrom: ".*\\d+ passages? on this device.*"
- assertTrue: ${parseInt(maestro.copiedText.match(/(\d+) passages?/)[1], 10) === output.kept}
# A passage kept because REV was asked to review it cannot be let go.
- tapOn:
    id: "tab-map"
- tapOn: "Find.*"
- inputText: ${P_SUBMITTED.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_SUBMITTED}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
- tapOn:
    id: "passage-offline"
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: "toast"
    text: ".*Kept because you were asked to work on it\\..*"
- assertVisible: ".*(Downloading for offline|Only \\d+ of \\d+ files on this device|On this device).*"
