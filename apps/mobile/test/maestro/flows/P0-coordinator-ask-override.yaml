# P0 smoke on phones (decision 95): a coordinator asks someone to record a
# passage (P-Q2 → TRANS) and moves P-CHECK past its
# checkpoint, the Consultant check, with a reason (JRN-006's middle), then
# undoes it from History (no toast offers Undo, decision 134).
appId: com.frontierrnd.langquestnext
name: "P0 A coordinator asks someone and overrides a checkpoint"
tags:
  - p0
  - smoke
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${COORD_EMAIL}
      PASSWORD: ${COORD_PASSWORD}
- runFlow: ../common/welcome-skip.yaml
- extendedWaitUntil:
    visible:
      id: "tab-map"
    timeout: 60000
# Ask someone: the Map opens All languages for a coordinator.
- tapOn:
    id: "tab-map"
- tapOn: "${LANG_A}: .*Open its map.*"
- tapOn: "Find.*"
- inputText: ${P_Q2.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_Q2}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
- tapOn: "Something else\\?"
- tapOn: "Someone else should do this.*"
- assertVisible: "Ask someone to record"
- tapOn: ".*${TRANS_NAME}.*"
- scroll
- tapOn:
    id: "primary-action"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: "toast"
    timeout: 20000
# The upload bar, over every screen while the request waits to go up and for
# 4 s after (decision 166), moves the screens below it by its height as it
# goes: a tap aimed before then lands 52 pt low (on an iPhone the search field
# missed, the Luke 13 list stayed; run 43342922443, 2026-11-13).
- extendedWaitUntil:
    notVisible:
      id: "upload-bar"
    timeout: 30000
# Override: P-CHECK waits at the Consultant check, a checkpoint.
- tapOn:
    id: "header-back"
# The field by its ID, once the way back has finished: on an iPhone the field
# was still moving under the tap, which then missed it (run 9, 2026-11-12).
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "map-search"
- eraseText: 40
- inputText: ${P_CHECK.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_CHECK}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
# The team's checks are cards, and the Consultant check's can sit under the
# bottom bar, where a tap on its middle lands on the bar: bring it up first.
- scrollUntilVisible:
    element: "Consultant check, .*"
    direction: DOWN
    centerElement: true
- tapOn: "Consultant check, .*"
- assertVisible: "Checkpoint — later steps wait for this one\\."
- tapOn: "Move past this checkpoint…"
- assertVisible: "Move past the checkpoint\\?"
- tapOn: ".*Or type the reason.*"
- inputText: "Consultant visit postponed to March"
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: "Move past the checkpoint\\?"
- tapOn:
    text: "Move past checkpoint"
    waitToSettleTimeoutMs: 0
# History's Undo puts the checkpoint back, so JRN-006 finds P-CHECK as the
# fixture left it. (The toast's message and that the next step, the final
# approval, is offered are checked by JRN-006.)
# The card reads out the reason too: "Consultant check, moved past · <reason>".
- scrollUntilVisible:
    element: "Consultant check, moved past.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
# Each tap once the screen has settled: on an iPhone the history was still
# opening, and a tap aimed at Undo opened an entry (run 10, 2026-11-12).
- tapOn: "Versions and history"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "History.*"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Undo"
    index: 0
- tapOn:
    id: "header-close"
# The passage opens at its top again, with the card under the fold.
- scrollUntilVisible:
    element: "Consultant check, next"
    direction: DOWN
    centerElement: true
    timeout: 20000
