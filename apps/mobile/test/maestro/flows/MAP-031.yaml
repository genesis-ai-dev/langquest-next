# MAP-031, download buttons for passages kept on this device (docs/ui-test-suite/04-map.md,
# decisions 61 and 166): TRANS's five requests in Luke 13 are kept, so their rows say
# "On this device"; VIEW keeps nothing until it downloads P-DONE from the top of
# the passage, then its row says so once its audio is in.
appId: com.frontierrnd.langquestnext
name: "MAP-031 Download buttons for passages kept on this device"
tags:
  - map
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${TRANS_EMAIL}
      PASSWORD: ${TRANS_PASSWORD}
- runFlow: ../common/welcome-skip.yaml
- extendedWaitUntil:
    visible:
      id: "tab-map"
    timeout: 60000
- tapOn:
    id: "tab-map"
- tapOn: "Luke.*"
# Kept (asked of TRANS) and downloaded: each row's download button, and its spoken label, say so.
- scrollUntilVisible:
    element: "${P_NEW}\\..*"
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible: "${P_NEW}\\..*On this device.*"
    timeout: 180000
- scrollUntilVisible:
    element: "${P_Q4}\\..*On this device.*"
    direction: DOWN
    timeout: 180000

# VIEW keeps nothing at first.
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${VIEW_EMAIL}
      PASSWORD: ${VIEW_PASSWORD}
- runFlow: ../common/welcome-skip.yaml
- extendedWaitUntil:
    visible: "Progress"
    timeout: 60000
- tapOn: "Alpha:.*"
- tapOn: "Luke.*"
- scrollUntilVisible:
    element: "${P_DONE}\\..*"
    direction: DOWN
    timeout: 60000
- assertVisible: "${P_DONE}\\..*Audio not kept on this device.*"
- tapOn:
    text: "${P_DONE}\\..*"
    index: 0
# The line at the top of the passage is its download button.
- tapOn:
    id: "passage-offline"
    text: "Download for offline"
- extendedWaitUntil:
    visible:
      id: "passage-offline"
      text: "On this device"
    timeout: 180000
- tapOn:
    id: "header-back"
- scrollUntilVisible:
    element: "${P_DONE}\\..*On this device.*"
    direction: DOWN
    timeout: 180000
