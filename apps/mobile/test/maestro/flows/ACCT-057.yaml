# docs/ui-test-suite/11-account-and-settings.md, ACCT-057: a phone in
# disguise (decisions.md 171). More settings › App icon › a calculator and a
# code, typed on that calculator to put it on; then the app opens on the
# calculator, the code opens LangQuest, and LangQuest's own tile takes it off.
# Android closes the app each time its launcher entry changes, so the flow
# opens it again. Android only: an iPhone build has no disguise (decisions.md
# 171, amended 2026-11-03), so on iOS this flow fails at once.
appId: com.frontierrnd.langquestnext
name: "ACCT-057 A disguised phone opens on its calculator, and the code opens LangQuest"
tags:
  - acct
  - android-only
---
- assertTrue:
    condition: ${maestro.platform == 'android'}
    label: "ACCT-057 needs Android: an iPhone build has no App icon row"
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${TRANS_EMAIL}
      PASSWORD: ${TRANS_PASSWORD}
- runFlow: ../common/welcome-skip.yaml
- extendedWaitUntil:
    visible:
      id: "tab-me"
    timeout: 60000
- tapOn:
    id: "tab-me"
- tapOn: "More settings.*"
- tapOn: "App icon.*"
- tapOn: "Calculator 1"
- tapOn:
    id: "disguise-code"
- inputText: "2468"
- hideKeyboard
- tapOn:
    id: "primary-action"
- extendedWaitUntil:
    visible: "Type your code"
    timeout: 20000
- tapOn: "2"
- tapOn: "4"
- tapOn: "6"
- tapOn: "8"
# Leave the app, and open it again from the icon it has now.
- pressKey: Home
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible: "Equals"
    timeout: 60000
- assertNotVisible:
    id: "tab-me"
- assertNotVisible: "More settings.*"
- tapOn: "2"
- tapOn: "4"
- tapOn: "6"
- tapOn: "8"
- extendedWaitUntil:
    visible: "App icon.*|My Work|Next for you|Nothing is waiting on you"
    timeout: 60000
- runFlow:
    when:
      notVisible: "App icon.*"
    commands:
      - tapOn:
          id: "tab-me"
      - tapOn: "More settings.*"
- tapOn: "App icon.*"
- extendedWaitUntil:
    visible: "LangQuest"
    timeout: 20000
- tapOn:
    text: "LangQuest"
    index: 0
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "tab-me"
    timeout: 60000
- assertNotVisible: "Equals"
