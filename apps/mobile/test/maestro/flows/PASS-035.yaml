# PASS-035, keeping a passage on this device (docs/ui-test-suite/05-passage-record.md).
# P-S nobody asked for and nobody worked on, so it starts "Not kept"; P-NEW
# was asked of TRANS, so it is kept without a Stop button. Phones only: the
# web app keeps no audio offline (decision 58).
appId: com.frontierrnd.langquestnext
name: "PASS-035 Keep a passage on this device"
tags:
  - pass
---
- runFlow: ../common/launch.yaml
- runFlow:
    file: ../common/sign-in.yaml
    env:
      EMAIL: ${TRANS_EMAIL}
      PASSWORD: ${TRANS_PASSWORD}
- runFlow: ../common/welcome-skip.yaml
- extendedWaitUntil:
    visible:
      id: "tab-map"
    timeout: 60000
- tapOn:
    id: "tab-map"
- tapOn: "Find.*"
- inputText: ${P_S.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
# The result row (index 0 is the search field holding the same words).
- tapOn:
    text: "${P_S}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
- tapOn: "Something else\\?"
- assertVisible: ".*Not kept on this device.*"
- assertVisible: ".*Its text is here, but its audio needs a connection\\. Keep it offline to take it with you\\..*"
- tapOn:
    text: "Keep offline"
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: "toast"
    text: ".*Kept on this device\\. It downloads while you are connected\\..*"
- assertNotVisible:
    id: "toast-undo"
- extendedWaitUntil:
    visible: ".*Kept because you chose to keep it\\..*"
    timeout: 60000
- assertVisible: ".*On this device.*"
- tapOn:
    text: "Stop keeping offline"
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: "toast"
    text: ".*No longer kept\\. Its audio may be removed to make room\\..*"
- tapOn:
    id: "header-close"
- tapOn:
    id: "header-back"
# P-NEW, asked of TRANS: kept for that reason, and nothing to stop.
# The Map keeps the search: clear it and look for P-NEW.
- tapOn:
    text: "${P_S.split(':')[0]}"
    index: 0
- eraseText
- inputText: ${P_NEW.split(':')[0]}
- runFlow:
    file: ../common/dismiss-keyboard.yaml
    env:
      LABEL: ${LANG_A}
- tapOn:
    text: "${P_NEW}.*"
    index: 0
- extendedWaitUntil:
    visible: "(?i)Then the team"
    timeout: 30000
- tapOn: "Something else\\?"
- assertVisible: ".*Kept because you were asked to work on it\\..*"
- assertNotVisible: ".*Stop keeping offline.*"
