# Sign in from Sign In with EMAIL and PASSWORD. A dev build fills in the
# developer's own account, so each field is cleared first.
appId: com.frontierrnd.langquestnext
---
- extendedWaitUntil:
    visible: "Email or sign-in name"
    timeout: 60000
# The fields by their IDs: on an iPhone the label's text matches first, and a
# tap on it does not put the cursor in the field (iOS 26 simulator, 2026-11-11).
- tapOn:
    id: "sign-in-name"
- eraseText: 80
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- eraseText: 80
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "LangQuest"
- tapOn:
    id: "primary-action"
- extendedWaitUntil:
    notVisible: "Signing in…"
    timeout: 60000
# iOS offers to keep the password in the system's keychain: say no, it covers the screen.
# On a simulator's first sign-in the box took 20 s to show, and while it shows
# Maestro reads only the box (run 11, 2026-11-12): wait for it.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Save Password\\?"
          timeout: 30000
          optional: true
- runFlow:
    when:
      visible: "Save Password\\?"
    commands:
      - tapOn: "Not Now"
