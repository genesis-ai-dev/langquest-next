apply plugin: 'com.android.library'

group = 'expo.modules.nearbylink'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// The app's SDK versions, as microphone-energy reads them: minSdk 24, so the module loads
// everywhere and does nothing below Android 10 (docs/nearby-sync-plan.md 5.8).
buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}
project.android {
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }
}

// The golden vectors that vitest also reads (src/vectors.ts, test-vectors.json).
def nearbyVectors = file('../test-vectors.json').absolutePath

android {
  namespace "expo.modules.nearbylink"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  testOptions {
    unitTests.all {
      systemProperty 'nearby.vectors', nearbyVectors
      maxHeapSize = '1g'
    }
  }
  // Lint is one of the android-native job's three checks: an error fails it.
  lint {
    abortOnError true
    checkReleaseBuilds false
  }
}

dependencies {
  // Already in every build through expo-modules-core; named here because the radio classes use it.
  implementation 'androidx.annotation:annotation:1.11.0'
  testImplementation 'junit:junit:4.13.2'
}
